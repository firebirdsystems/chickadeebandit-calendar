    ${ev.location ? `<div class="ev-detail-row"><div class="ev-detail-icon">📍</div><div class="ev-detail-val">${esc(ev.location)}</div></div>` : ""}
    ${ruleLabel ? `<div class="ev-detail-row"><div class="ev-detail-icon">🔁</div><div class="ev-detail-val"><span class="recurrence-badge">${ruleLabel}</span></div></div>` : ""}
    ${attHtml ? `<div class="ev-detail-row"><div class="ev-detail-icon">👥</div><div class="ev-detail-val">${attHtml}</div></div>` : ""}
    ${ev.description ? `<div class="ev-detail-row"><div class="ev-detail-icon">📝</div><div class="ev-detail-val" style="color:var(--muted)">${esc(ev.description)}</div></div>` : ""}
    ${ev.calendar_name ? `<div style="font-size:.75rem;color:var(--muted);margin-top:4px">From: ${esc(ev.calendar_name)}</div>` : ""}
    ${ev.source === "synced" ? `<div style="font-size:.75rem;color:var(--muted);margin-top:4px">Synced from external calendar — editing not available here.</div>` : ""}
    ${ev.source === "cross-app" && ev.source_label ? `<div style="font-size:.75rem;color:var(--muted);margin-top:4px">From ${esc(ev.source_label)} — manage it there.</div>` : ""}

    return `<button type="button" class="attendee-btn${sel ? " selected" : ""}" data-testid="attendee-toggle" data-mid="${m.id}" onclick="toggleAttendee(this)">
      <span class="attendee-av" style="background:${memberColor(m.id, members)}">${initial(m.name)}</span>

    </div>
    <div class="form-row"><label class="form-label">Start</label>

        <input id="ef-start-date" data-testid="field-start-date" class="form-input" type="date" value="${ev.start_date ?? opts.defaultDate ?? todayStr()}" />
        <input id="ef-start-time" data-testid="field-start-time" class="form-input" type="time" value="${ev.start_time ?? "09:00"}" style="${ev.all_day ? "display:none" : ""}" />
      </div></div>
    <div class="form-row"><label class="form-label">End</label>
      <div class="form-inline">
        <input id="ef-end-date" data-testid="field-end-date" class="form-input" type="date" value="${ev.end_date ?? opts.defaultDate ?? todayStr()}" />

    <div class="form-row"><label class="form-label">Location</label>
      <input id="ef-loc" data-testid="field-location" class="form-input" type="text" value="${esc(ev.location ?? "")}" placeholder="Add location" /></div>
    <div class="form-row"><label class="form-label">Color</label><div class="color-swatches">${colorsHtml}</div></div>
    ${members.length > 0 ? `<div class="form-row"><label class="form-label">Attendees</label><div class="attendee-grid">${attsHtml}</div></div>` : ""}
    <div class="form-row"><label class="form-label">Description</label>
      <textarea id="ef-desc" data-testid="field-description" class="form-textarea">${esc(ev.description ?? "")}</textarea></div>
    <div class="rec-section">

window.toggleAllDay = function(cb) { document.querySelectorAll("#ef-start-time, #ef-end-time").forEach(el => el.style.display = cb.checked ? "none" : ""); };
window.selectColor  = function(btn, color) { document.getElementById("ef-color").value = color; document.querySelectorAll(".color-swatch").forEach(b => b.classList.remove("selected")); btn.classList.add("selected"); };
window.toggleAttendee = function(btn) { btn.classList.toggle("selected"); };
window.toggleRecFields = function(freq) {

  document.getElementById("rec-ends-row").style.display = freq === "none" ? "none" : "";

  document.getElementById("rec-date-row").style.display  = type === "date"  ? "" : "none";

// ─── Conflict warning ─────────────────────────────────────────────────────
// First save click with attendee conflicts shows a warning and flips the
// button to "… anyway"; the second click proceeds. Reset on every modal open.
let conflictAck = false;
/**
 * Attendees double-booked by a proposed change. Detection only — no DOM — so
 * the modal warning and the drag confirmation ask the same question of the
 * same data instead of each deciding for themselves what counts as a clash.
 */
function findConflictsFor(data, excludeIds = new Set()) {
  let attendees = [];
  try { attendees = JSON.parse(data.attendee_ids || "[]"); } catch { /* no attendees */ }
  if (!attendees.length) return [];
  const pool = eventsForRange(data.start_date, data.end_date || data.start_date, { filtered: false });
  return findMemberConflicts(data, attendees, pool, excludeIds);
}

/** One conflict as plain text. Escaped by the caller that needs markup. */
function conflictLine({ event: ev, memberIds }) {
  const names = memberIds.map(id => members.find(m => m.id === id)?.name ?? "Someone").join(", ");
  const time = (ev.all_day || !ev.start_time) ? "all day"
    : [fmtTime(ev.start_time), fmtTime(ev.end_time)].filter(Boolean).join(" – ");
  return `${names}: ${ev.title} (${fmtDateShort(ev._date ?? ev.start_date)}, ${time})`;
}

/** The conflict list as the hub confirm dialog's plain-text description. */
function describeConflicts(conflicts) {
  const lines = conflicts.slice(0, 4).map(conflictLine);
  if (conflicts.length > 4) lines.push(`…and ${conflicts.length - 4} more`);
  return lines.join("\n");
}

function warnConflicts(data, excludeIds = new Set()) {
  if (conflictAck) return false;
  const conflicts = findConflictsFor(data, excludeIds);
  if (!conflicts.length) return false;
  const items = conflicts.slice(0, 4).map(c => `<li>${esc(conflictLine(c))}</li>`).join("");
  const extra = conflicts.length > 4 ? `<li>…and ${conflicts.length - 4} more</li>` : "";
  let box = document.getElementById("conflict-warning");
  if (!box) {
    box = document.createElement("div");
    box.id = "conflict-warning";
    box.className = "conflict-box";
    box.dataset.testid = "conflict-warning";
    modalEl?.querySelector(".modal-actions")?.before(box);
  }
  box.innerHTML = `⚠️ <strong>Schedule conflict</strong><ul>${items}${extra}</ul>`;
  const btn = modalEl?.querySelector(".modal-actions .btn-primary");
  if (btn && !btn.textContent.endsWith("anyway")) btn.textContent += " anyway";
  conflictAck = true;
  return true;
}

function collectFormData() {
  const allDay = document.getElementById("ef-allday").checked;
  const freq   = document.getElementById("ef-freq").value;
  const endType = document.getElementById("ef-end-type")?.value ?? "never";
  const selDays = [...document.querySelectorAll(".day-toggle.selected")].map(b => b.dataset.day);
  const attendees = [...document.querySelectorAll(".attendee-btn.selected")].map(b => b.dataset.mid);
  let recurrence = null;
  if (freq !== "none") {
    const rule = { freq: freq === "biweekly" ? "weekly" : freq === "weekdays" ? "weekly" : freq, interval: freq === "biweekly" ? 2 : 1, end_type: endType };
    if (freq === "weekly" && selDays.length > 0) rule.days = selDays;
    if (freq === "weekdays") rule.days = ["mon","tue","wed","thu","fri"];
    if (endType === "count") rule.count = parseInt(document.getElementById("ef-count").value) || 10;
    if (endType === "date")  rule.end_date = document.getElementById("ef-end-date-rec").value;
    recurrence = JSON.stringify(rule);
  }
  return {
    title: document.getElementById("ef-title").value.trim(),
    description: document.getElementById("ef-desc").value.trim(),
    location: document.getElementById("ef-loc").value.trim(),
    start_date: document.getElementById("ef-start-date").value,
    start_time: allDay ? null : (document.getElementById("ef-start-time").value || null),
    end_date: document.getElementById("ef-end-date").value,
    end_time: allDay ? null : (document.getElementById("ef-end-time").value || null),
    all_day: allDay ? 1 : 0,
    color: document.getElementById("ef-color").value,
    attendee_ids: JSON.stringify(attendees),
    recurrence,
  };
}
function openCreateModal(defaultDate = null) {
  openModal(`<div class="modal-header"><h3>New Event</h3><button class="btn btn-ghost btn-sm" data-testid="modal-close" onclick="closeModal()">✕</button></div>
    ${buildEventForm({}, { defaultDate })}
    <div class="modal-actions">
      <button class="btn btn-ghost" data-testid="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" data-testid="event-create-submit" onclick="submitCreate()">Create Event</button>
    </div>`, "event-create-modal");
}
window.submitCreate = async function() {
  const data = collectFormData();
  if (!data.title) { document.getElementById("ef-title").focus(); return; }
  if (warnConflicts(data)) return;
  const id = crypto.randomUUID(), now = new Date().toISOString();
  localEvents.push({
    id, ...data, source: "local",
    organizer_id: ME?.id ?? null, created_by: ME?.id ?? null,
    created_at: now, updated_at: now,
    recurring_event_id: null, original_date: null, is_cancelled: 0,
  });
  closeModal();
  render();
  try {
    await db(
      `INSERT INTO app_calendar__events (id,title,description,location,start_date,start_time,end_date,end_time,all_day,color,organizer_id,attendee_ids,recurrence,source,created_by,created_at,updated_at)
       VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,'local',?,?,?)`,
      [id, data.title, data.description, data.location, data.start_date, data.start_time, data.end_date, data.end_time,
       data.all_day, data.color, ME?.id ?? null, data.attendee_ids, data.recurrence, ME?.id ?? null, now, now]
    );
    // member_id repeats created_by because the hub's roster attribution reads
    // member_id and nothing else: without it the event is attributed to its
    // subject (the event row id), which is not a member row, so a roster peer
    // never sees a steward's calendar event. Contract CI enforces the pairing.
    await publishEvent("calendar.event_created", id, {
      title: data.title,
      start_date: data.start_date,
      all_day: data.all_day === 1,
      created_by: ME?.id ?? "unknown",
      member_id: ME?.id ?? "unknown",
    });
  } catch {
    localEvents = localEvents.filter(e => e.id !== id);
    render();
  }
};

// ─── Edit ─────────────────────────────────────────────────────────────────
async function openEditModal(primaryId, occDate) {
  // A drag writes the same columns this form does. Opening on top of an
  // unsettled drag would let the form's save land first and be silently
  // overwritten by the drag arriving after it. Waiting also means the form
  // opens showing the dragged times rather than the ones it replaced.
  await settlePendingDrag(primaryId);
  const primary = localEvents.find(e => e.id === primaryId);
  if (!primary) return;
  if (primary.recurrence) openScopeModal("edit", primaryId, occDate);
  else openDirectEdit(primary, "all", occDate);
}
function openDirectEdit(ev, scope, occDate) {
  const primary = localEvents.find(e => e.id === (ev._primaryId ?? ev.id)) ?? ev;
  const editTarget = (scope === "this" && ev.recurring_event_id) ? ev : (scope !== "all" ? { ...primary, start_date: occDate, end_date: occDate } : primary);
  openModal(`<div class="modal-header"><h3>Edit Event</h3><button class="btn btn-ghost btn-sm" data-testid="modal-close" onclick="closeModal()">✕</button></div>
    ${buildEventForm(editTarget)}
    <div class="modal-actions">
      <button class="btn btn-ghost" data-testid="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" data-testid="event-edit-submit" onclick="submitEdit('${primary.id}','${scope}','${occDate}')">Save</button>
    </div>`, "event-edit-modal");
}
window.submitEdit = async function(primaryId, scope, occDate) {
  // openEditModal already waited once, but the form stays open across further
  // interaction. Gating the write itself is what actually holds the invariant:
  // no mutation of an event proceeds while a drag on it is unresolved.
  await settlePendingDrag(primaryId);
  const data = collectFormData();
  if (!data.title) { document.getElementById("ef-title").focus(); return; }
  const now = new Date().toISOString();
  const primary = localEvents.find(e => e.id === primaryId);
  if (!primary) return;
  const seriesIds = new Set([primaryId, ...localEvents.filter(e => e.recurring_event_id === primaryId).map(e => e.id)]);
  if (warnConflicts(data, seriesIds)) return;

  if (scope === "all" || !primary.recurrence) {
    const prevEvents = [...localEvents];
    localEvents = localEvents.map(e => e.id === primaryId ? { ...e, ...data, updated_at: now } : e);
    closeModal();
    render();
    try {
      await db(`UPDATE app_calendar__events SET title=?,description=?,location=?,start_date=?,start_time=?,end_date=?,end_time=?,all_day=?,color=?,attendee_ids=?,recurrence=?,updated_at=? WHERE id=?`,
        [data.title,data.description,data.location,data.start_date,data.start_time,data.end_date,data.end_time,data.all_day,data.color,data.attendee_ids,data.recurrence,now,primaryId]);
    } catch {
      // Restored THROUGH the pending-drag registry. Before drags existed every
      // mutation went through this modal and could not overlap another, so a
      // wholesale snapshot was a safe undo. A drag on a different event can
      // now land between this snapshot and this failure, and replaying the
      // snapshot raw would wipe that move off the screen while its write had
      // already succeeded.
      localEvents = withPendingDrags(prevEvents);
      render();
    }
    return;
  }

  // Recurrence scopes — pessimistic (multi-step operations)
  const btn = modalEl?.querySelector('.modal-actions .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  if (scope === "this") {
    const existing = localEvents.find(e => e.recurring_event_id === primaryId && e.original_date === occDate);
    const durDays = daysBetween(primary.start_date, primary.end_date);
    const endDate = data.end_date !== occDate ? data.end_date : addDayStr(data.start_date, durDays);
    if (existing) {
      await db(`UPDATE app_calendar__events SET title=?,description=?,location=?,start_date=?,start_time=?,end_date=?,end_time=?,all_day=?,color=?,attendee_ids=?,updated_at=? WHERE id=?`,
        [data.title,data.description,data.location,data.start_date,data.start_time,endDate,data.end_time,data.all_day,data.color,data.attendee_ids,now,existing.id]);
    } else {
      const exId = crypto.randomUUID();
      await db(`INSERT INTO app_calendar__events (id,title,description,location,start_date,start_time,end_date,end_time,all_day,color,organizer_id,attendee_ids,recurring_event_id,original_date,source,created_by,created_at,updated_at)
        VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,'local',?,?,?)`,
        [exId,data.title,data.description,data.location,data.start_date,data.start_time,endDate,data.end_time,data.all_day,data.color,ME?.id??null,data.attendee_ids,primaryId,occDate,ME?.id??null,now,now]);
    }
  } else if (scope === "following") {
    const rule = JSON.parse(primary.recurrence ?? "{}");
    rule.end_date = addDayStr(occDate, -1);
    const newId = crypto.randomUUID();
    await dbBatch([
      { sql: `UPDATE app_calendar__events SET recurrence=?,updated_at=? WHERE id=?`, params: [JSON.stringify(rule),now,primaryId] },
      { sql: `INSERT INTO app_calendar__events (id,title,description,location,start_date,start_time,end_date,end_time,all_day,color,organizer_id,attendee_ids,recurrence,source,created_by,created_at,updated_at)
         VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,'local',?,?,?)`,
        params: [newId,data.title,data.description,data.location,occDate,data.start_time,occDate,data.end_time,data.all_day,data.color,ME?.id??null,data.attendee_ids,data.recurrence,ME?.id??null,now,now] },
    ]);
  }
  await loadLocalEvents(); closeModal(); render();
};

// ─── Delete ───────────────────────────────────────────────────────────────
async function confirmDelete(primaryId, occDate, isRecurring) {
  // Same reason as openEditModal: never race a pending drag on this row.
  await settlePendingDrag(primaryId);
  if (isRecurring) openScopeModal("delete", primaryId, occDate);
  else if (await hubConfirm({ message: "Delete this event?", confirmLabel: "Delete", destructive: true })) deleteEvent(primaryId, occDate, "all");
}
async function hideEvent(id) {
  const prev = [...syncedEvents];
  syncedEvents = syncedEvents.filter(e => e.id !== id);
  closeModal();
  render();
  try {
    const now = new Date().toISOString();
    await db(`INSERT INTO app_calendar__hidden_synced_events (event_id, hidden_at) VALUES (?,?) ON CONFLICT DO NOTHING`, [id, now]);
  } catch {
    syncedEvents = prev;
    render();
  }
}
async function deleteEvent(primaryId, occDate, scope) {
  await settlePendingDrag(primaryId);   // same invariant as submitEdit
  const now = new Date().toISOString();
  const primary = localEvents.find(e => e.id === primaryId);
  if (!primary) return;

  if (scope === "all" || !primary.recurrence) {
    const prevEvents = [...localEvents];
    localEvents = localEvents.filter(e => e.id !== primaryId && e.recurring_event_id !== primaryId);
    closeModal();
    render();
    try {
      await db(`DELETE FROM app_calendar__events WHERE id=? OR recurring_event_id=?`, [primaryId, primaryId]);
    } catch {
      localEvents = withPendingDrags(prevEvents);   // same reason as submitEdit
      render();
    }
    return;
  }

  if (scope === "this") {
    const existing = localEvents.find(e => e.recurring_event_id === primaryId && e.original_date === occDate);
    if (existing) {
      await db(`UPDATE app_calendar__events SET is_cancelled=1,updated_at=? WHERE id=?`, [now, existing.id]);
    } else {
      const exId = crypto.randomUUID();
      await db(`INSERT INTO app_calendar__events (id,title,description,location,start_date,start_time,end_date,end_time,all_day,color,organizer_id,attendee_ids,recurring_event_id,original_date,is_cancelled,source,created_by,created_at,updated_at)
        VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,1,'local',?,?,?)`,
        [exId,primary.title,primary.description,primary.location,occDate,primary.start_time,occDate,primary.end_time,primary.all_day,primary.color,ME?.id??null,"[]",primaryId,occDate,ME?.id??null,now,now]);
    }
  } else if (scope === "following") {
    const rule = JSON.parse(primary.recurrence ?? "{}");
    rule.end_date = addDayStr(occDate, -1); rule.end_type = "date";
    await dbBatch([
      { sql: `UPDATE app_calendar__events SET recurrence=?,updated_at=? WHERE id=?`, params: [JSON.stringify(rule), now, primaryId] },
      { sql: `DELETE FROM app_calendar__events WHERE recurring_event_id=? AND original_date>=?`, params: [primaryId, occDate] },
    ]);
  }
  await loadLocalEvents(); closeModal(); render();
}

// ─── Scope picker ─────────────────────────────────────────────────────────
function openScopeModal(action, primaryId, occDate) {
  const isEdit = action === "edit";
  const scopeOpts = [
    { scope: "this",      icon: "📌", label: "This event",               desc: `Only ${fmtDateShort(occDate)}` },
    { scope: "following", icon: "➡️", label: "This and following events", desc: `From ${fmtDateShort(occDate)} onwards` },
    { scope: "all",       icon: "🔁", label: "All events",               desc: `Every occurrence in the series` },
  ];
  openModal(`
    <div class="modal-header">
      <h3>${isEdit ? "Edit recurring event" : "Delete recurring event"}</h3>
      <button class="btn btn-ghost btn-sm" data-testid="modal-close" onclick="closeModal()">✕</button>
    </div>
    <p style="font-size:.85rem;color:var(--muted);margin-bottom:14px">Which events do you want to ${isEdit ? "edit" : "delete"}?</p>
    ${scopeOpts.map(o => `
      <div class="scope-option" data-testid="scope-option" data-scope="${o.scope}" onclick="${isEdit ? `closeModal();openDirectEdit_('${primaryId}','${o.scope}','${occDate}')` : `closeModal();deleteEvent('${primaryId}','${occDate}','${o.scope}')`}">
        <span class="scope-icon">${o.icon}</span>
        <div><div class="scope-label">${o.label}</div><div class="scope-desc">${o.desc}</div></div>
      </div>`).join("")}
    <div class="modal-actions"><button class="btn btn-ghost" data-testid="modal-cancel" onclick="closeModal()">Cancel</button></div>`, "event-scope-modal");
}
window.openDirectEdit_ = function(primaryId, scope, occDate) {
  const primary = localEvents.find(e => e.id === primaryId);
  if (primary) openDirectEdit(primary, scope, occDate);
};
window.openEditModal   = openEditModal;
window.confirmDelete   = confirmDelete;
window.deleteEvent     = deleteEvent;

// ─── Modal ────────────────────────────────────────────────────────────────
// `testid` names the dialog for the UI-scenario runner (ui-scenarios.json), so a
// scenario can wait on the specific modal it opened rather than any modal.
function openModal(html, testid = "modal") {
  closeModal();
  conflictAck = false;
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal" data-testid="${testid}">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  // Programmatic focus works inside cross-origin iframes (unlike the autofocus
  // attribute, which the browser blocks) because it rides the user's click gesture.
  modalEl.querySelector("[data-autofocus]")?.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

// ─── Navigation ───────────────────────────────────────────────────────────
function refreshSyncedAndRender() {
  render();
  loadSyncedEvents().then(() => render()).catch(() => {});
}

function prevPeriod() {
  if (viewMode === "month")  pivot.setMonth(pivot.getMonth() - 1);
  else if (viewMode === "week")  pivot.setDate(pivot.getDate() - 7);
  else if (viewMode === "day")   pivot.setDate(pivot.getDate() - 1);
  else pivot.setDate(pivot.getDate() - 30);
  refreshSyncedAndRender();
}
function nextPeriod() {
  if (viewMode === "month")  pivot.setMonth(pivot.getMonth() + 1);
  else if (viewMode === "week")  pivot.setDate(pivot.getDate() + 7);
  else if (viewMode === "day")   pivot.setDate(pivot.getDate() + 1);
  else pivot.setDate(pivot.getDate() + 30);
  refreshSyncedAndRender();
}
function goToday() { pivot = new Date(); refreshSyncedAndRender(); }
function setView(v) { viewMode = v; render(); }

window.prevPeriod      = prevPeriod;
window.nextPeriod      = nextPeriod;
window.goToday         = goToday;
window.setView         = setView;
window.openCreateModal = openCreateModal;
window.openDayPanel    = openDayPanel;
window.showEvent       = showEvent;
window._showEvByKey    = _showEvByKey;
window._hideEvByKey    = _hideEvByKey;
window.closeModal      = closeModal;
window.closePanels     = closePanels;

// ─── Deep link ────────────────────────────────────────────────────────────
function handleDeepLink() {
  const eventId = new URLSearchParams(window.location.search).get("eventId");
  if (!eventId) return;
  const ev = localEvents.find(e => e.id === eventId) ?? syncedEvents.find(e => e.id === eventId);
  if (ev) showEvent(ev.id, ev.start_date, ev._primaryId ?? ev.id, ev._occDate ?? ev.start_date);
}

// ─── Init ─────────────────────────────────────────────────────────────────
(async () => {
  async function fetchMembers() {
    if (!CONTEXT) return;
    try {
      const res = await fetch(`${CONTEXT}?keys=family.members`);
      members = ((await res.json())["family.members"]) ?? [];
    } catch { members = []; }
  }
  // Read-only members (everyone but the steward in a roster) never see the
  // "+ Event" control — writes would be rejected by the hub anyway.
  if (!canWrite) { const b = document.getElementById("new-event-btn"); if (b) b.style.display = "none"; }
  await Promise.all([
    fetchMembers(),
    (async () => { if (DB) { await initDb(); await loadLocalEvents(); } })(),
    loadSyncedEvents(),
  ]);
  render();
  handleDeepLink();
})();
</script>
