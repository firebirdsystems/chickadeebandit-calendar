<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-light: var(--bg);
      --today-bg: var(--hub-tint-success, #f0fdf4); --today-ring: #16a34a; --today-ring-ink: var(--hub-tint-success-fg, #16a34a); --other-month: #9ca3af;
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 900px; margin: 0 auto; padding: 12px 16px 40px; }

    /* ── App header ──────────────────────────────────────── */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .nav-group { display: flex; align-items: center; gap: 8px; }
    .cal-title { font-size: 1.25rem; font-weight: 700; min-width: 160px; }
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: 8px; font-size: 0.82rem;
      font-weight: 600; cursor: pointer; border: none; transition: opacity .15s;
    }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover { opacity: .88; }
    .btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--muted); }
    .btn-ghost:hover { border-color: var(--text); color: var(--text); }
    .btn-icon { background: var(--card); border: 1.5px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 7px; font-size: 0.9rem; }
    .btn-icon:hover { background: var(--border); }
    .btn-sm { padding: 4px 10px; font-size: 0.78rem; }
    .btn-danger { background: #dc2626; color: white; }

    .view-toggle {
      display: flex; border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .view-toggle button {
      padding: 6px 12px; border: none; background: transparent;
      font-size: 0.82rem; font-weight: 600; cursor: pointer; color: var(--muted);
    }
    .view-toggle button.active { background: var(--accent); color: var(--accent-fg); }

    /* ── Month grid ──────────────────────────────────────── */
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; background: var(--card);
    }
    .cal-dow {
      padding: 6px 4px; text-align: center;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .cal-cell {
      min-height: 90px; padding: 4px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      cursor: pointer; position: relative;
      transition: background .1s;
    }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell:hover { background: var(--bg); }
    .cal-cell.other-month { background: var(--bg); }
    .cal-cell.today { background: var(--today-bg); }
    .cal-day-num {
      font-size: 0.78rem; font-weight: 600; color: var(--muted);
      margin-bottom: 3px; width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
    }
    .cal-cell.today .cal-day-num { background: var(--today-ring); color: white; }
    .cal-cell.other-month .cal-day-num { color: var(--other-month); }

    /* ── Event pills (month view) ────────────────────────── */
    .ev-pill {
      display: block; width: 100%; margin-bottom: 2px;
      padding: 1px 5px; border-radius: 4px;
      font-size: 0.68rem; font-weight: 600; color: white;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer; line-height: 1.6;
    }
    .ev-pill.synced { opacity: .65; }
    .ev-pill.cross-app { opacity: .85; box-shadow: inset 0 0 0 1.5px #7c3aed; }
    .ev-pill .ev-time { opacity: .85; margin-right: 3px; }
    .ev-more { font-size: 0.65rem; color: var(--muted); font-weight: 600; padding: 1px 4px; cursor: pointer; }
    .ev-more:hover { color: var(--accent); }

    /* ── Agenda view ─────────────────────────────────────── */
    .agenda-day-heading {
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted);
      padding: 14px 0 6px;
      display: flex; align-items: center; gap: 8px;
    }
    .agenda-day-heading .day-num {
      font-size: 1.4rem; font-weight: 800; color: var(--text);
      text-transform: none; letter-spacing: 0; line-height: 1;
    }
    .agenda-day-heading.today-heading .day-num { color: var(--today-ring-ink); }
    .agenda-event {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 10px 14px; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 6px; cursor: pointer; transition: border-color .15s;
    }
    .agenda-event:hover { border-color: var(--accent); }
    .agenda-event.synced { opacity: .75; }
    .agenda-event.cross-app { border-left: 3px solid #7c3aed; }
    .ev-color-bar { width: 4px; border-radius: 2px; flex-shrink: 0; align-self: stretch; }
    .agenda-time { font-size: 0.78rem; color: var(--muted); min-width: 70px; flex-shrink: 0; padding-top: 2px; font-weight: 500; }
    .agenda-body { flex: 1; min-width: 0; }
    .agenda-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
    .agenda-meta { font-size: 0.75rem; color: var(--muted); }
    .agenda-empty { text-align: center; padding: 40px; color: var(--muted); font-size: 0.9rem; }

    /* ── Time grid (day / week views) ────────────────────── */
    .tg-wrap {
      display: flex; flex-direction: column;
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; background: var(--card);
    }
    .tg-header {
      display: flex; border-bottom: 2px solid var(--border);
      background: var(--bg); flex-shrink: 0;
    }
    .tg-gutter {
      width: 52px; flex-shrink: 0;
      border-right: 1px solid var(--border);
    }
    .tg-day-hdr {
      flex: 1; text-align: center; padding: 6px 2px;
      cursor: pointer; border-right: 1px solid var(--border);
      transition: background .1s;
    }
    .tg-day-hdr:last-child { border-right: none; }
    .tg-day-hdr:hover { background: var(--accent-light); }
    .tg-hdr-dow { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .tg-hdr-num {
      font-size: .95rem; font-weight: 700; color: var(--text);
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 2px auto 0;
    }
    .tg-day-hdr.tg-today .tg-hdr-dow { color: var(--today-ring-ink); }
    .tg-day-hdr.tg-today .tg-hdr-num { background: var(--today-ring); color: white; }

    .tg-allday-bar {
      display: flex; border-bottom: 1px solid var(--border);
      background: var(--bg); flex-shrink: 0; min-height: 24px;
    }
    .tg-allday-lbl {
      width: 52px; flex-shrink: 0; font-size: .6rem; color: var(--muted);
      text-align: right; padding: 5px 6px 4px;
      border-right: 1px solid var(--border);
    }
    .tg-allday-col {
      flex: 1; padding: 2px 3px;
      border-right: 1px solid var(--border);
    }
    .tg-allday-col:last-child { border-right: none; }
    .tg-allday-ev {
      font-size: .67rem; font-weight: 600; color: white;
      padding: 1px 5px; border-radius: 3px; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    }
    .tg-allday-more { font-size: .62rem; color: var(--muted); padding: 1px 3px; cursor: pointer; }

    .tg-scroll { overflow-y: auto; flex: 1; max-height: 580px; }
    .tg-body { display: flex; }
    .tg-hours { width: 52px; flex-shrink: 0; border-right: 1px solid var(--border); }
    .tg-hour-slot {
      height: 56px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start;
      font-size: .62rem; color: var(--muted);
      padding: 3px 6px 0; white-space: nowrap;
    }
    .tg-cols { display: flex; flex: 1; }
    .tg-col {
      flex: 1; position: relative;
      border-right: 1px solid var(--border);
      background: var(--card);
    }
    .tg-col:last-child { border-right: none; }
    .tg-col.tg-today { background: var(--bg); }
    .tg-col-lines {
      position: absolute; inset: 0; pointer-events: none;
    }
    .tg-col-line {
      height: 56px; border-bottom: 1px solid var(--border);
    }
    .tg-col-line:nth-child(odd) {
      border-bottom-style: dashed; border-bottom-color: #f0f0f0;
    }

    .tg-ev {
      position: absolute; left: 2px; right: 2px;
      border-radius: 4px; padding: 3px 5px;
      cursor: pointer; overflow: hidden; z-index: 1;
      opacity: .93; transition: opacity .1s;
      min-height: 18px;
    }
    .tg-ev:hover { opacity: 1; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
    .tg-ev-title { font-size: .7rem; font-weight: 700; color: white; line-height: 1.3; }
    .tg-ev-time  { font-size: .62rem; color: rgba(255,255,255,.85); }

    /* ── Drag & resize ───────────────────────────────────────
       Only events isDraggableEvent() accepts get these — a read-only or
       synced event keeps the plain pointer so the affordance never promises
       a write the row policy will refuse. */
    /* pan-y, not none: the time grid scrolls vertically, and a dense day is
       mostly event boxes. Taking the gesture outright would leave a finger
       landing on an event unable to scroll at all. The long press below is
       what separates "scrolling" from "dragging"; until it lands the browser
       keeps the gesture. */
    .tg-ev.draggable { cursor: grab; touch-action: pan-y; }
    .tg-ev.dragging {
      cursor: grabbing; opacity: 1; z-index: 5;
      box-shadow: 0 4px 12px rgba(0,0,0,.28);
    }
    .tg-ev.armed { box-shadow: 0 0 0 2px var(--accent-fg), 0 0 0 4px rgba(0,0,0,.35); }
    /* The handles DO take the gesture: they are 8px targets deliberately aimed
       at, never somewhere a scroll starts, and a resize that needed a long
       press first would feel broken. */
    .tg-ev-handle {
      position: absolute; left: 0; right: 0; height: 8px;
      cursor: ns-resize; touch-action: none; z-index: 2;
    }
    .tg-ev-handle-top { top: -1px; }
    .tg-ev-handle-bot { bottom: -1px; }
    /* A grab bar, shown on hover so it does not clutter a dense week. It is
       decorative only: the 8px hit area above is always live, including on
       touch, where there is no hover to reveal anything. */
    .tg-ev-handle::after {
      content: ""; position: absolute; left: 50%; transform: translateX(-50%);
      top: 3px; width: 24px; height: 2px; border-radius: 2px;
      background: rgba(255,255,255,.75); opacity: 0; transition: opacity .1s;
    }
    .tg-ev:hover .tg-ev-handle::after, .tg-ev.dragging .tg-ev-handle::after { opacity: 1; }
    /* Live readout of where the drop would land, pinned to the box. */
    .tg-ev-ghost-time {
      position: absolute; top: 2px; right: 4px; z-index: 3;
      font-size: .62rem; font-weight: 700; color: white;
      background: rgba(0,0,0,.45); border-radius: 3px; padding: 0 4px;
      white-space: nowrap; pointer-events: none;
    }
    .tg-drag-error {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px;
      z-index: 60; max-width: 90vw;
      background: #7f1d1d; color: white; font-size: .8rem;
      padding: 8px 14px; border-radius: var(--radius);
      box-shadow: 0 4px 14px rgba(0,0,0,.3);
    }

    .tg-now-line {
      position: absolute; left: 0; right: 0; height: 2px;
      background: #ef4444; z-index: 2;
    }
    .tg-now-dot {
      position: absolute; left: -4px; top: -4px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #ef4444;
    }

    /* ── Day panel ───────────────────────────────────────── */
    .day-panel-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.35);
      display: flex; align-items: flex-end; justify-content: center; z-index: 50;
    }
    @media (min-width: 600px) { .day-panel-backdrop { align-items: center; padding: 20px; } }
    .day-panel {
      background: var(--card); border-radius: var(--radius) var(--radius) 0 0;
      width: 100%; max-width: 500px; padding: 20px;
      max-height: 75vh; overflow-y: auto;
    }
    @media (min-width: 600px) { .day-panel { border-radius: var(--radius); } }
    .day-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .day-panel-title { font-size: 1rem; font-weight: 700; }
    .day-panel-event {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px; border-radius: 8px; border: 1px solid var(--border);
      margin-bottom: 8px; cursor: pointer;
    }
    .day-panel-event:hover { border-color: var(--accent); }
    .day-panel-event .time { font-size: 0.75rem; color: var(--muted); min-width: 60px; padding-top: 1px; }
    .day-panel-event .ev-title { font-weight: 600; font-size: 0.88rem; }
    .day-panel-event .ev-loc { font-size: 0.75rem; color: var(--muted); }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center; z-index: 100;
    }
    @media (min-width: 600px) { .modal-backdrop { align-items: center; padding: 20px; } }
    .modal {
      background: var(--card); border-radius: var(--radius) var(--radius) 0 0;
      width: 100%; max-width: 540px; padding: 22px;
      max-height: 94vh; overflow-y: auto;
    }
    @media (min-width: 600px) { .modal { border-radius: var(--radius); } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-header h3 { font-size: 1.05rem; font-weight: 700; }

    .form-row { margin-bottom: 13px; }
    .form-label {
      display: block; font-size: 0.72rem; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; border: 1.5px solid var(--border); border-radius: 7px;
      padding: 8px 11px; font-size: 0.9rem; outline: none; font-family: inherit;
      transition: border-color .15s; background: var(--card);
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-textarea { resize: vertical; min-height: 60px; }
    .form-inline { display: flex; gap: 8px; align-items: flex-start; }
    .form-inline > * { flex: 1; }
    .muted-label { font-weight: 400; text-transform: none; }

    .color-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
    .color-swatch {
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      border: 2.5px solid transparent; transition: all .12s;
    }
    .color-swatch.selected { border-color: #111827; transform: scale(1.15); }

    .attendee-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .attendee-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px;
      border: 1.5px solid var(--border); cursor: pointer;
      font-size: 0.8rem; font-weight: 500; color: var(--muted);
      background: transparent; transition: all .12s;
    }
    .attendee-btn.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
    .attendee-av { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; font-weight: 700; color: white; }

    .rec-section { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }
    .days-grid { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .day-toggle {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1.5px solid var(--border); cursor: pointer;
      font-size: 0.72rem; font-weight: 700; color: var(--muted); background: transparent;
    }
    .day-toggle.selected { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }

    .scope-option {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 8px; cursor: pointer; margin-bottom: 8px; transition: all .12s;
    }
    .scope-option:hover { border-color: var(--accent); background: var(--accent-light); }
    .scope-option .scope-icon { font-size: 1.1rem; }
    .scope-option .scope-label { font-weight: 600; font-size: 0.88rem; }
    .scope-option .scope-desc { font-size: 0.75rem; color: var(--muted); }

    .ev-detail-color { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .ev-detail-row { display: flex; gap: 10px; margin-bottom: 8px; font-size: 0.88rem; }
    .ev-detail-icon { width: 18px; text-align: center; color: var(--muted); flex-shrink: 0; padding-top: 1px; }
    .ev-detail-val { flex: 1; }
    .recurrence-badge { display: inline-block; font-size: 0.72rem; background: var(--accent-light); color: var(--accent); padding: 2px 8px; border-radius: 20px; font-weight: 600; }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .toggle-switch { position: relative; width: 40px; height: 22px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 22px; cursor: pointer; transition: .2s; }
    .toggle-slider:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px; background: var(--card); border-radius: 50%; transition: .2s; }
    .toggle-switch input:checked + .toggle-slider { background: var(--accent); }
    .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }

    .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .modal-actions .btn { flex: 1; justify-content: center; min-width: 90px; }

    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

    /* ── Member filter bar ───────────────────────────────── */
    .member-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .member-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 10px 3px 4px; border-radius: 20px;
      border: 1.5px solid var(--border); cursor: pointer;
      font-size: 0.78rem; font-weight: 500; color: var(--muted);
      background: var(--card); transition: all .12s;
    }
    .member-chip:hover { border-color: var(--text); color: var(--text); }
    .member-chip.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
    .member-chip.clear { padding: 3px 10px; }

    /* ── Attendee avatar stacks on event rows ────────────── */
    .av-stack { display: inline-flex; align-items: center; margin-top: 3px; }
    .av-stack .attendee-av { margin-right: -5px; border: 1.5px solid var(--card); width: 17px; height: 17px; }
    .av-stack .av-more { font-size: 0.65rem; color: var(--muted); margin-left: 9px; font-weight: 600; }

    /* ── Who's busy strip (day panel) ────────────────────── */
    .busy-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .busy-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 9px 3px 4px; border-radius: 20px;
      background: var(--accent-light); font-size: 0.75rem; font-weight: 600; color: var(--text);
    }
    .busy-chip .busy-n { color: var(--muted); font-weight: 500; }

    /* ── Conflict warning (event form) ───────────────────── */
    .conflict-box {
      background: var(--hub-tint-warning, #fffbeb); border: 1px solid var(--hub-tint-warning-border, #fcd34d); border-radius: 8px;
      padding: 10px 12px; font-size: 0.8rem; color: var(--hub-tint-warning-fg, #92400e); margin-top: 12px;
    }
    .conflict-box ul { margin: 4px 0 0 18px; }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
  <base href="/run/calendar/" />
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="nav-group">
      <button class="btn-icon" data-testid="nav-prev" onclick="prevPeriod()">‹</button>
      <span class="cal-title" id="cal-title" data-testid="cal-title">…</span>
      <button class="btn-icon" data-testid="nav-next" onclick="nextPeriod()">›</button>
      <button class="btn btn-ghost btn-sm" data-testid="nav-today" onclick="goToday()">Today</button>
    </div>
    <div class="nav-group">
      <div class="view-toggle">
        <button id="vbtn-day"    data-testid="view-day"    onclick="setView('day')">Day</button>
        <button id="vbtn-week"   data-testid="view-week"   onclick="setView('week')">Week</button>
        <button id="vbtn-month"  data-testid="view-month"  onclick="setView('month')">Month</button>
        <button id="vbtn-agenda" data-testid="view-agenda" onclick="setView('agenda')">Agenda</button>
      </div>
      <button class="btn btn-primary" id="new-event-btn" data-testid="new-event" onclick="openCreateModal()">+ Event</button>
    </div>
  </div>
  <div class="member-bar" id="member-bar" data-testid="member-bar"></div>
  <div id="root" data-testid="root"><div class="loading">Loading…</div></div>
</div>

<script type="module">
import { memberColor, initial, esc, isAdult, hubConfirm, searchMatch, hubToday } from "/hub-sdk.js";
import {
  MONTHS, MONTHS_SHORT, DAYS_SHORT, DAYS_ABBR, DAY_NAMES, EVENT_COLORS,
  p2, toDateStr, parseLD, addDaysObj, addDayStr, todayStr, daysBetween, getWeekStart,
  timeToMins, fmtTime, fmtDate, fmtDateShort,
  normalizeDate, normalizeTime,
  describeRecurrence, advanceCursor,
  memberIdsOf, findMemberConflicts, searchableFields,
  eventSpanMins, applyMove, applyResize, isDraggableEvent,
  applyMoveAcrossDays, pickColumnDate, autoScrollVelocity,
  isNoopDragPatch, dragChangesDate,
  createPendingDrags,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB      = window.__DB_URL      ?? "";
const ME      = window.__CURRENT_MEMBER ?? null;
const IS_ADMIN  = window.__IS_ADMIN === true;
const IS_ROSTER = window.__SPACE_KIND === "roster";
// Who may create, edit, or delete events. In a roster (classroom / team) only
// the steward — the space admin/teacher — manages the calendar; everyone else
// reads it. Elsewhere every member may (calendar's normal shared behavior). The
// hub enforces this server-side (owner_or_visibility + steward_writes_only on
// `events`); this only hides controls that would 403.
const canWrite = !IS_ROSTER || IS_ADMIN;
// Hiding a synced event is HOUSEHOLD-WIDE and, today, permanent — the row is
// keyed on event_id alone and nothing in the app deletes it again. That makes it
// an adult action, and `hidden_synced_events` is now adult_writable so the rule
// is enforced rather than merely observed. The control is gated to match: left
// visible it would be a button that throws and rolls its own optimistic update
// back. (A per-member hide, or any unhide at all, would both be improvements —
// see the note on this table.)
const canHideSynced = canWrite && isAdult(ME);

const EVENTS = window.__EVENTS_URL ?? "";

// Announce a newly created event on the cross-app bus so other apps can react to
// a date the household just committed to — open a volunteer sheet, file a care
// task, start a capsule. Only the manually created event fires: a synced
// provider feed would re-emit hundreds of rows on every poll, and an edit or a
// cancellation is not a new commitment.
//
// Title and date only. Every calendar row is visibility 'everyone', so the title
// is already household-wide, but the description and location are the parts
// people put addresses and private notes in and they do not belong in every
// rule's payload.
async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS) return;
  try {
    await fetch(EVENTS, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, subject_id: subjectId, payload }),
    });
  } catch {
    // Best-effort: the row is already written, so a failed publish is not fatal.
  }
}

// ─── State ────────────────────────────────────────────────────────────────
let members      = [];
let localEvents  = [];
let syncedEvents = [];
let memberFilter = new Set();
let viewMode     = "week";
let searchQ = "";       // in-app search (see logic.js searchableFields)
let pivot        = new Date();
let modalEl      = null;
let panelEl      = null;
/**
 * Drag writes that have not settled yet. See createPendingDrags in logic.js
 * for what the registry guarantees and why it lives there — every concurrency
 * defect this feature had was in that bookkeeping, and untestable while it was
 * entangled with the DOM.
 *
 * Declared here with the rest of the module state rather than beside the drag
 * handlers, so loadLocalEvents — defined well above them — can read it.
 */
const pendingDrags = createPendingDrags();

const HOUR_H = 56; // px per hour in time grid


// ─── DB ───────────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sql, params }) });
  const json = await res.json();
  // The hub reports a refused write as a JSON body with an `error` key
  // (403 row policy, 400 bad statement, 507 over quota). fetch() does not
  // reject on those, so without this throw every caller's rollback and
  // error toast below is unreachable code.
  if (!res.ok || json.error) throw new Error(json.error || `Database request failed (${res.status})`);
  return json;
}
/**
 * Several statements as one transaction — all apply, or none does.
 *
 * Splitting a recurring series is exactly two writes that must agree: cap the
 * original series the day before the split, and create (or delete) what follows.
 * Run as concurrent requests, either could fail alone — capping without creating
 * silently truncates the series, and creating without capping leaves two series
 * overlapping on the same dates, each showing the other's occurrences.
 */
async function dbBatch(statements) {
  if (!DB || statements.length === 0) return { results: [] };
  const res = await fetch(DB, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ statements }) });
  const json = await res.json();
  if (!res.ok || json.error) throw new Error(json.error || `Database request failed (${res.status})`);
  return json;
}
async function initDb() {
  // Schema is managed by hub migrations (migrations/001_init.sql)
}
/**
 * Put back the optimistic positions a wholesale re-read is about to discard.
 *
 * Every full reload replaces localEvents with what the database currently
 * holds, which for an event whose own drag write is still in flight is its OLD
 * position. Nothing reapplies it when that write later succeeds, so the grid
 * would sit stale until the next load — and there are several reloads, not
 * one: a failed drag's authoritative refresh, a recurring edit, a recurring
 * delete. Hence this lives inside loadLocalEvents rather than at any of its
 * call sites, where the next reload added would quietly miss it.
 */
function withPendingDrags(rows, exceptId) {
  return pendingDrags.apply(rows, exceptId);
}

/**
 * @param exceptId  An event whose stored row should win over its pending
 *                  patch — the one being authoritatively re-read after its
 *                  own write turned out not to apply.
 */
async function loadLocalEvents(exceptId = null) {
  // start_time is plaintext (_time suffix), so SQL already returns within-day
  // clock order, all-day events first (NULL sorts first). This statement must
  // stay byte-identical to manifest.preload.events or the preload stops
  // matching and the app pays a round-trip on first render.
  //
  // The sort below still earns its place: remote events are merged into
  // localEvents afterwards, so the combined list needs re-ordering by the same
  // rule the SQL applies.
  const { rows } = await db(`SELECT * FROM app_calendar__events WHERE source = 'local' ORDER BY start_date, start_time`);
  // Patched BEFORE the sort: a restored patch changes start_time and, for a
  // cross-day drag, start_date — which is the SQL's first sort key — and
  // localEvents is expected to be in the order the SQL asked for.
  localEvents = withPendingDrags(rows ?? [], exceptId).sort((a, b) =>
    (a.start_date ?? "").localeCompare(b.start_date ?? "")
    || (a.start_time == null ? 0 : 1) - (b.start_time == null ? 0 : 1)
    || (a.start_time ?? "").localeCompare(b.start_time ?? "")
  );
}
async function loadSyncedEvents() {
  if (!CONTEXT) return;
  try {
    const res  = await fetch(`${CONTEXT}?keys=family.calendar,cross.calendar_events`);
    const data = await res.json();
    const raw            = data["family.calendar"] ?? [];
    const crossAppEvents = data["cross.calendar_events"] ?? [];
    const normalizeBase = ev => ({
      id: ev.id ?? crypto.randomUUID(), title: ev.title ?? ev.summary ?? "Event",
      description: ev.description ?? "", location: ev.location ?? "",
      start_date: normalizeDate(ev.start ?? ev.startAt ?? ev.start_at ?? ev.start_date ?? ev.date ?? ev.scheduled_at, hubToday()),
      start_time: normalizeTime(ev.start ?? ev.startAt ?? ev.start_at ?? ev.scheduled_at),
      end_date: normalizeDate(ev.end ?? ev.endAt ?? ev.end_at ?? ev.end_date ?? ev.date ?? ev.scheduled_at, hubToday()),
      end_time: normalizeTime(ev.end ?? ev.endAt ?? ev.end_at), all_day: (ev.all_day ?? ev.allDay) ? 1 : 0,
      color: "#6b7280", organizer_id: (ev.member_ids?.[0]) ?? ev.familyMemberId ?? ev.family_member_id ?? null,
      calendar_name: ev.calendarName ?? ev.calendar_name ?? null,
      attendee_ids: ev.member_ids ? JSON.stringify(ev.member_ids) : "[]",
    });
    const { rows: hidden } = await db(`SELECT event_id FROM app_calendar__hidden_synced_events`);
    const hiddenIds = new Set((hidden ?? []).map(r => r.event_id));
    const allSynced = [
      ...raw.map(ev => ({ ...normalizeBase(ev), source: "synced" })),
      ...crossAppEvents.map(ev => ({ ...normalizeBase(ev), source: "cross-app", color: "#0369a1", source_label: ev.source_label ?? null })),
    ];
    syncedEvents = allSynced.filter(ev => !hiddenIds.has(ev.id));
  } catch { syncedEvents = []; }
}

// ─── Recurrence expansion ─────────────────────────────────────────────────
function eventsForRange(rangeStart, rangeEnd, { filtered = true } = {}) {
  const results = [];
  const exMap = {};
  for (const ev of localEvents) {
    if (ev.recurring_event_id) {
      if (!exMap[ev.recurring_event_id]) exMap[ev.recurring_event_id] = {};
      exMap[ev.recurring_event_id][ev.original_date] = ev;
    }
  }
  for (const ev of localEvents) {
    if (ev.recurring_event_id) continue;
    if (!ev.recurrence) {
      if (ev.start_date <= rangeEnd && ev.end_date >= rangeStart)
        results.push({ ...ev, _date: ev.start_date });
    } else {
      const rule = JSON.parse(ev.recurrence);
      const occs = occurrencesInRange(ev.start_date, rule, rangeStart, rangeEnd);
      const durDays = daysBetween(ev.start_date, ev.end_date);
      for (const occ of occs) {
        const ex = exMap[ev.id]?.[occ];
        if (ex?.is_cancelled) continue;
        if (ex) results.push({ ...ex, _date: ex.start_date, _primaryId: ev.id, _occDate: occ });
        else results.push({ ...ev, start_date: occ, end_date: addDayStr(occ, durDays), _date: occ, _virtual: true, _primaryId: ev.id, _occDate: occ });
      }
    }
  }
  for (const ev of syncedEvents) {
    if (ev.start_date <= rangeEnd && ev.end_date >= rangeStart)
      results.push({ ...ev, _date: ev.start_date });
  }
  const visible = filtered && memberFilter.size
    ? results.filter(ev => { const ids = memberIdsOf(ev); return [...memberFilter].some(id => ids.has(id)); })
    : results;
  return visible.sort((a, b) => {
    const dc = a._date.localeCompare(b._date);
    if (dc !== 0) return dc;
    if (a.all_day !== b.all_day) return a.all_day ? -1 : 1;
    if (a.start_time && b.start_time) return a.start_time.localeCompare(b.start_time);
    return 0;
  });
}
function occurrencesInRange(startDate, rule, rangeStart, rangeEnd) {
  const results = [];
  const rs = parseLD(rangeStart), re = parseLD(rangeEnd);
  const ruleEnd = rule.end_date ? parseLD(rule.end_date) : null;
  let count = 0, maxCount = rule.count ?? 10000;
  let cursor = parseLD(startDate);
  if (cursor < rs) {
    const { freq, interval: iv = 1 } = rule;
    if (freq === "daily") { const skip = Math.max(0, Math.floor((rs - cursor) / 86400000 / iv) - 1); cursor = addDaysObj(cursor, skip * iv); }
    else if (freq === "weekly" && (!rule.days || rule.days.length <= 1)) { const skip = Math.max(0, Math.floor((rs - cursor) / (86400000 * 7 * iv)) - 1); cursor = addDaysObj(cursor, skip * 7 * iv); }
    else if (freq === "monthly") { const mo = (rs.getFullYear() - cursor.getFullYear()) * 12 + rs.getMonth() - cursor.getMonth(); cursor.setMonth(cursor.getMonth() + Math.max(0, Math.floor(mo / iv) - 1) * iv); }
    else if (freq === "yearly") { const yr = rs.getFullYear() - cursor.getFullYear(); cursor.setFullYear(cursor.getFullYear() + Math.max(0, Math.floor(yr / iv) - 1) * iv); }
  }
  let iter = 0;
  while (cursor <= re && count < maxCount && iter++ < 3000) {
    if (ruleEnd && cursor > ruleEnd) break;
    if (cursor >= rs) { results.push(toDateStr(cursor)); count++; }
    cursor = advanceCursor(cursor, rule);
  }
  return results;
}

// ─── Render main ──────────────────────────────────────────────────────────
function updateTitle() {
  const el = document.getElementById("cal-title");
  if (!el) return;
  if (viewMode === "month") {
    el.textContent = `${MONTHS[pivot.getMonth()]} ${pivot.getFullYear()}`;
  } else if (viewMode === "week") {
    const ws = getWeekStart(pivot);
    const we = addDaysObj(ws, 6);
    if (ws.getMonth() === we.getMonth())
      el.textContent = `${MONTHS_SHORT[ws.getMonth()]} ${ws.getDate()} – ${we.getDate()}, ${ws.getFullYear()}`;
    else
      el.textContent = `${MONTHS_SHORT[ws.getMonth()]} ${ws.getDate()} – ${MONTHS_SHORT[we.getMonth()]} ${we.getDate()}`;
  } else if (viewMode === "day") {
    el.textContent = pivot.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  } else {
    el.textContent = "Upcoming";
  }
  document.querySelectorAll(".view-toggle button").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById(`vbtn-${viewMode}`);
  if (btn) btn.classList.add("active");
}

// ─── Safe event registry ──────────────────────────────────────────────────
// Event IDs from synced (external) calendars can contain single quotes and
// other characters that would break out of JS string contexts in onclick="".
// Instead of interpolating IDs into onclick strings, we register each event
// object in a flat array and pass only its integer index to the handler.
let _evReg = [];
function _regEv(ev, ds) { _evReg.push({ ev, ds }); return _evReg.length - 1; }
// The detail modal shows exactly one event; capture its edit/delete target here so
// the Edit/Delete buttons need not interpolate a DB-controlled id into an inline
// onclick JS string (an injection vector — ids are attacker-writable via raw SQL).
let _detailEditId = null, _detailOccDate = null, _detailIsRecurring = false;
window._editCurrent   = () => openEditModal(_detailEditId, _detailOccDate);
window._deleteCurrent = () => confirmDelete(_detailEditId, _detailOccDate, _detailIsRecurring);
function _showEvByKey(k) {
  const { ev, ds } = _evReg[k];
  showEvent(ev.id, ds, ev._primaryId ?? ev.id, ev._occDate ?? ds);
}
function _hideEvByKey(k) { hideEvent(_evReg[k].ev.id); }

function render() {
  _evReg = [];
  updateTitle();
  renderMemberBar();
  if (viewMode === "month")  renderMonth();
  else if (viewMode === "week") renderWeek();
  else if (viewMode === "day")  renderDay();
  else renderAgenda();
}

// ─── Member filter bar ────────────────────────────────────────────────────
function renderMemberBar() {
  const el = document.getElementById("member-bar");
  if (!el) return;
  if (members.length < 2) { el.innerHTML = ""; return; }
  el.innerHTML = members.map((m, i) =>
    `<button class="member-chip${memberFilter.has(m.id) ? " selected" : ""}" data-testid="member-chip" data-member-id="${m.id}" onclick="_toggleMemberFilter(${i})" title="Show ${esc(m.name)}'s events">
      <span class="attendee-av" style="background:${memberColor(m.id, members)}">${initial(m.name)}</span>${esc(m.name)}</button>`
  ).join("") + (memberFilter.size
    ? `<button class="member-chip clear" data-testid="member-filter-clear" onclick="_clearMemberFilter()">✕ Show all</button>` : "");
}
window._toggleMemberFilter = (i) => {
  const id = members[i]?.id;
  if (!id) return;
  if (memberFilter.has(id)) memberFilter.delete(id); else memberFilter.add(id);
  render();
};
window._clearMemberFilter = () => { memberFilter.clear(); render(); };

// ─── Attendee avatar stack ────────────────────────────────────────────────
function avatarStack(ev) {
  const ids = [...memberIdsOf(ev)].filter(id => members.some(m => m.id === id));
  if (!ids.length) return "";
  const shown = ids.slice(0, 4).map(id => {
    const m = members.find(x => x.id === id);
    return `<span class="attendee-av" title="${esc(m.name)}" style="background:${memberColor(id, members)}">${initial(m.name)}</span>`;
  }).join("");
  const more = ids.length > 4 ? `<span class="av-more">+${ids.length - 4}</span>` : "";
  return `<span class="av-stack">${shown}${more}</span>`;
}

// ─── Month view ───────────────────────────────────────────────────────────
function renderMonth() {
  const year = pivot.getFullYear(), month = pivot.getMonth();
  const firstDay = new Date(year, month, 1);
  const gridStart = addDaysObj(firstDay, -firstDay.getDay());
  const gridEnd   = addDaysObj(gridStart, 41);
  const rangeStart = toDateStr(gridStart), rangeEnd = toDateStr(gridEnd);
  const evs = eventsForRange(rangeStart, rangeEnd);
  const byDate = {};
  for (const ev of evs) { if (!byDate[ev._date]) byDate[ev._date] = []; byDate[ev._date].push(ev); }
  const dowHtml = DAYS_SHORT.map(d => `<div class="cal-dow">${d}</div>`).join("");
  let cellsHtml = "", cur = new Date(gridStart);
  const today = todayStr();
  while (cur <= gridEnd) {
    const ds = toDateStr(cur), isT = ds === today, inM = cur.getMonth() === month;
    const dayEvs = byDate[ds] ?? [], show = dayEvs.slice(0,3), more = dayEvs.length - show.length;
    const pillsHtml = show.map(ev => {
      const timeStr = ev.all_day ? "" : `<span class="ev-time">${fmtTime(ev.start_time)}</span>`;
      return `<span class="ev-pill${ev.source==="synced"?" synced":ev.source==="cross-app"?" cross-app":""}" style="background:${esc(ev.color)}"
        data-testid="event-pill" data-event-id="${esc(ev.id)}" data-date="${ds}"
        onclick="event.stopPropagation();_showEvByKey(${_regEv(ev,ds)})"
        title="${esc(ev.title)}">${timeStr}${esc(ev.title)}</span>`;
    }).join("");
    const moreHtml = more > 0 ? `<div class="ev-more" data-testid="month-more" onclick="event.stopPropagation();openDayPanel('${ds}')">+${more} more</div>` : "";
    cellsHtml += `<div class="cal-cell${isT?" today":""}${!inM?" other-month":""}" data-testid="month-cell" data-date="${ds}" onclick="openDayPanel('${ds}')">
      <div class="cal-day-num">${cur.getDate()}</div>${pillsHtml}${moreHtml}</div>`;
    cur.setDate(cur.getDate() + 1);
  }
  document.getElementById("root").innerHTML = `<div class="cal-grid" data-testid="month-grid">${dowHtml}${cellsHtml}</div>`;
}

// ─── Time grid (shared by Day and Week) ───────────────────────────────────
function renderTimeGrid(dates) {
  const rangeStart = dates[0], rangeEnd = dates[dates.length - 1];
  const evs = eventsForRange(rangeStart, rangeEnd);
  const today = todayStr();

  // Separate all-day vs timed
  const allDayByDate = {}, timedByDate = {};
  for (const ev of evs) {
    const bucket = (ev.all_day || !ev.start_time) ? allDayByDate : timedByDate;
    if (!bucket[ev._date]) bucket[ev._date] = [];
    bucket[ev._date].push(ev);
  }

  // Header row
  const headerHtml = dates.map(ds => {
    const d = parseLD(ds), isT = ds === today;
    return `<div class="tg-day-hdr${isT?" tg-today":""}" data-testid="timegrid-day-header" data-date="${ds}" onclick="switchToDay('${ds}')">
      <div class="tg-hdr-dow">${DAYS_SHORT[d.getDay()]}</div>
      <div class="tg-hdr-num">${d.getDate()}</div>
    </div>`;
  }).join("");

  // All-day row
  const allDayHtml = dates.map(ds => {
    const dayEvs = allDayByDate[ds] ?? [];
    const rows = dayEvs.slice(0,2).map(ev =>
      `<div class="tg-allday-ev" style="background:${esc(ev.color)}"
        data-testid="allday-event" data-event-id="${esc(ev.id)}" data-date="${ds}"
        onclick="_showEvByKey(${_regEv(ev,ds)})"
        title="${esc(ev.title)}">${esc(ev.title)}</div>`
    ).join("");
    const more = dayEvs.length > 2 ? `<div class="tg-allday-more" data-testid="allday-more">+${dayEvs.length-2} more</div>` : "";
    return `<div class="tg-allday-col" data-date="${ds}">${rows}${more}</div>`;
  }).join("");

  // Hour labels column
  const hoursHtml = Array.from({length:24}, (_,h) =>
    `<div class="tg-hour-slot">${h === 0 ? "" : fmtTime(`${p2(h)}:00`)}</div>`
  ).join("");

  // Day columns
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const nowTop  = (nowMins / 60) * HOUR_H;

  const colsHtml = dates.map(ds => {
    const isT = ds === today;
    const dayEvs = timedByDate[ds] ?? [];

    // Simple overlap detection: group into columns
    const cols = [];
    const sorted = [...dayEvs].sort((a,b) => (timeToMins(a.start_time)??0) - (timeToMins(b.start_time)??0));
    for (const ev of sorted) {
      const startM = timeToMins(ev.start_time) ?? 0;
      const endM   = timeToMins(ev.end_time) ?? (startM + 60);
      let placed = false;
      for (const col of cols) {
        const last = col[col.length - 1];
        const lastEnd = timeToMins(last.end_time) ?? ((timeToMins(last.start_time) ?? 0) + 60);
        if (startM >= lastEnd) { col.push(ev); placed = true; break; }
      }
      if (!placed) cols.push([ev]);
    }
    const nCols = cols.length || 1;

    const evHtml = cols.flatMap((col, ci) => col.map(ev => {
      // Same span the drag math reads — see eventSpanMins. A second copy of
      // this rule here is how the renderer and the drag handlers came to
      // disagree about an inverted end_time.
      const { start: startM, end: endM } = eventSpanMins(ev);
      const top    = (startM / 60) * HOUR_H;
      const height = Math.max(((endM - startM) / 60) * HOUR_H - 2, 18);
      const w = `${90 / nCols}%`;
      const l = `${(ci * 90 / nCols) + 2}%`;
      const showTime = height > 30;
      // Resize handles eat 16px of a box's vertical hit area. Below ~34px that
      // leaves nothing to grab for a move, so a short event is move-only and
      // resizing it means opening the form.
      const drag = isDraggableEvent(ev, { canWrite });
      const handles = drag && height > 34
        ? `<div class="tg-ev-handle tg-ev-handle-top" data-testid="tg-resize-start" data-drag-edge="start"></div>
           <div class="tg-ev-handle tg-ev-handle-bot" data-testid="tg-resize-end" data-drag-edge="end"></div>`
        : "";
      return `<div class="tg-ev${drag ? " draggable" : ""}" style="top:${top}px;height:${height}px;background:${esc(ev.color)};width:${w};left:${l}"
        data-testid="timegrid-event" data-event-id="${esc(ev.id)}" data-date="${ds}"
        ${drag ? `data-drag-id="${esc(ev.id)}"` : ""}
        onclick="_showEvByKey(${_regEv(ev,ds)})"
        title="${esc(ev.title)}">
        ${handles}
        <div class="tg-ev-title">${esc(ev.title)}</div>
        ${showTime ? `<div class="tg-ev-time">${fmtTime(ev.start_time)}</div>` : ""}
      </div>`;
    })).join("");

    const gridLines = Array.from({length:24}, () => `<div class="tg-col-line"></div>`).join("");
    const nowLine = isT ? `<div class="tg-now-line" style="top:${nowTop}px"><div class="tg-now-dot"></div></div>` : "";

    return `<div class="tg-col${isT?" tg-today":""}" data-testid="timegrid-column" data-date="${ds}" style="height:${24*HOUR_H}px">
      <div class="tg-col-lines">${gridLines}</div>
      ${nowLine}${evHtml}
    </div>`;
  }).join("");

  document.getElementById("root").innerHTML = `
    <div class="tg-wrap" data-testid="time-grid">
      <div class="tg-header">
        <div class="tg-gutter"></div>
        ${headerHtml}
      </div>
      <div class="tg-allday-bar">
        <div class="tg-allday-lbl">all day</div>
        ${allDayHtml}
      </div>
      <div class="tg-scroll" id="tg-scroll">
        <div class="tg-body">
          <div class="tg-hours">${hoursHtml}</div>
          <div class="tg-cols">${colsHtml}</div>
        </div>
      </div>
    </div>`;

  // Scroll to 7am (or current time if today is visible)
  const scrollEl = document.getElementById("tg-scroll");
  if (scrollEl) {
    const scrollTo = dates.includes(today) ? Math.max(nowTop - 80, 0) : 7 * HOUR_H;
    scrollEl.scrollTop = scrollTo;
    // render() replaces #root wholesale, so the listeners go with it and are
    // re-attached here rather than delegated from a longer-lived ancestor.
    attachTimeGridDrag(scrollEl);
  }
}

// ─── Time-grid drag & resize ──────────────────────────────────────────────
// A drag moves an event in time and, in week view, across days; the resize
// handles change its duration on its own day. The all-day row and recurring
// occurrences are still out (see isDraggableEvent for what each one would
// need beyond this code).
//
// Everything that decides what gets WRITTEN lives in logic.js and is unit
// tested. This file measures the DOM, feeds it those functions, and draws
// what they return.

const DRAG_THRESHOLD_PX = 4;   // mouse: a few px of jitter is still a click
const TOUCH_ARM_MS      = 400; // touch: long-press to arm
const TOUCH_CANCEL_PX   = 8;   // touch: movement before arming is a scroll

let dragState = null;

function attachTimeGridDrag(scrollEl) {
  scrollEl.addEventListener("pointerdown", onDragPointerDown);
}

/**
 * Suppress the click a completed drag ends in.
 *
 * The event box carries an inline onclick that opens the detail modal, and a
 * drop still produces a click. Capture phase on window runs before that inline
 * handler — and before the optimistic re-render can detach the box it was
 * bound to, which is why this listens on window rather than on the grid.
 *
 * The listener is torn down on the next macrotask, so it can only ever eat the
 * click belonging to THIS gesture. A flag cleared on a timer instead swallowed
 * whatever click came next, which after a fast drop-then-click was a real
 * click on a different event.
 */
function swallowNextClick() {
  const swallow = (e) => { e.stopPropagation(); e.preventDefault(); };
  window.addEventListener("click", swallow, true);
  setTimeout(() => window.removeEventListener("click", swallow, true), 0);
}

function onDragPointerDown(e) {
  if (e.button > 0) return;              // right / middle click is not a drag
  if (dragState) {
    // A stray second pointer. abandonDrag() may re-render to undo the first
    // drag's preview, which replaces #root — so `e.target` is now detached.
    // closest() still walks a detached tree quite happily, and continuing
    // would capture this pointer on an orphaned box: a drag with no visible
    // preview that still persists a move on release. Give this gesture up.
    abandonDrag();
    return;
  }
  const box = e.target.closest?.(".tg-ev[data-drag-id]");
  if (!box) return;
  const ev = localEvents.find(x => x.id === box.dataset.dragId);
  // Re-checked against the row rather than trusted from the markup: a reload
  // between render and grab could have turned this into something unmovable.
  if (!ev || !isDraggableEvent(ev, { canWrite })) return;
  if (pendingDrags.has(ev.id)) return;   // its last drag has not settled yet

  const edge = e.target.closest(".tg-ev-handle")?.dataset.dragEdge ?? null;
  const scrollEl = e.currentTarget;
  // One traversal and one rect for the column this event sits in: the vertical
  // anchor and the horizontal origin below must describe the SAME box.
  const colEl = box.closest(".tg-col");
  const colRect = colEl?.getBoundingClientRect();
  dragState = {
    box, ev, edge,
    scrollEl,
    pointerId: e.pointerId,
    startY: e.clientY,
    startX: e.clientX,
    // The column this event lives in, and where its top edge was when the
    // grab happened. Every later vertical delta is measured against this, so
    // a grid that moves under a stationary finger moves the event with it.
    colEl,
    startColTop: colRect?.top ?? 0,
    // The day columns, in left-to-right order. Measured once here rather than
    // on every move: a pointermove that reads layout right after writing the
    // box's style forces a reflow per frame. They only move on a resize, which
    // re-measures below.
    columns: measureDayColumns(scrollEl),
    originLeft: colRect?.left ?? 0,
    lastX: e.clientX,
    lastY: e.clientY,
    rafId: 0,
    previewDx: 0,
    // A mouse press is unambiguous, and so is grabbing a resize handle — an
    // 8px bar is aimed at, never somewhere a scroll starts, and its CSS has
    // already taken the gesture. A touch on the body of the box is ambiguous:
    // the same swipe scrolls the grid, so it waits for a long press.
    active: e.pointerType === "mouse" || Boolean(edge),
    moved: false,
    patch: null,
    armTimer: null,
  };

  if (dragState.active) {
    capturePointer(box, e.pointerId);
  } else {
    dragState.armTimer = setTimeout(() => {
      if (!dragState) return;
      dragState.active = true;
      dragState.box.classList.add("armed");
      capturePointer(dragState.box, dragState.pointerId);
      navigator.vibrate?.(8);
    }, TOUCH_ARM_MS);
  }

  window.addEventListener("pointermove", onDragPointerMove);
  window.addEventListener("pointerup", onDragPointerUp);
  window.addEventListener("pointercancel", onDragPointerCancel);
  // preventDefault() on a pointermove does not reliably stop a scroll the
  // browser has already claimed under touch-action: pan-y — touchmove is the
  // event that does, and only while non-passive. Registered for the life of
  // the gesture rather than globally so the grid scrolls normally otherwise.
  window.addEventListener("touchmove", onDragTouchMove, { passive: false });
  window.addEventListener("resize", onViewportResize);
}

/** The day columns as pickColumnDate wants them: `{ date, left, right }`. */
function measureDayColumns(scrollEl) {
  return [...scrollEl.querySelectorAll(".tg-col[data-date]")].map(el => {
    const r = el.getBoundingClientRect();
    return { date: el.dataset.date, left: r.left, right: r.right };
  });
}

/**
 * The WINDOW resizing mid-gesture — not an event's edge, which everything else
 * in this section means by "resize".
 *
 * Rare on a desktop and routine on a phone, where it is a rotation. It moves
 * the columns out from under the cached rects, and stale rects would keep
 * mapping the pointer to the column that used to be there, so the drop lands
 * on a day the member never pointed at.
 */
function onViewportResize() {
  if (!dragState) return;
  dragState.columns = measureDayColumns(dragState.scrollEl);
  // Not startColTop: that is the anchor the vertical delta is measured FROM,
  // and re-reading it would discard however far the grid has already moved and
  // jump the event. A reflow that shifts the column is a real movement of the
  // content under a still pointer, and dragDeltaY is right to count it.
  dragState.originLeft = dragState.colEl?.getBoundingClientRect().left ?? dragState.originLeft;
  updateDragPreview();
}

/** Suppress the scroll once a drag has actually taken the gesture. */
function onDragTouchMove(e) {
  if (dragState?.active && dragState.moved && e.cancelable) e.preventDefault();
}

function capturePointer(box, pointerId) {
  try { box.setPointerCapture(pointerId); } catch { /* capture is an optimization */ }
}

function onDragPointerMove(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  // Something else re-rendered mid-gesture — another event's drag settling, a
  // recurring edit completing — and #root, with it this box, was replaced.
  // Previewing into a detached node is invisible, and dropping one would
  // persist a move against a grid the member can no longer see. The fresh
  // render already shows the truth, so this just ends quietly.
  if (!dragState.box.isConnected) { endDrag(); return; }
  dragState.lastX = e.clientX;
  dragState.lastY = e.clientY;
  const dy = dragDeltaY();

  if (!dragState.active) {
    // Moving before the long press lands means this was a scroll all along.
    // dy counts the scroller's own movement too, so a fling that carries the
    // grid away under a still finger is caught here as well — which is right,
    // because that is exactly what a scroll is.
    if (Math.abs(dy) > TOUCH_CANCEL_PX) abandonDrag();
    return;
  }
  // A sideways drag is a drag too. Testing only dy meant an event pulled
  // straight into the next day never passed the threshold and never started.
  // Only for a MOVE, though: a resize cannot go sideways, so counting
  // horizontal jitter there would start a gesture that changes nothing.
  const dx = dragState.edge ? 0 : e.clientX - dragState.startX;
  if (!dragState.moved && Math.abs(dy) < DRAG_THRESHOLD_PX && Math.abs(dx) < DRAG_THRESHOLD_PX) return;

  if (!dragState.moved) {
    dragState.moved = true;
    dragState.box.classList.add("dragging");
    startAutoScroll();
  }
  if (e.cancelable) e.preventDefault();
  updateDragPreview();
}

/**
 * How far the event has travelled vertically, in grid pixels.
 *
 * The pointer's own movement PLUS however far the grid has moved beneath it.
 * Without the second term the grid slides under a stationary pointer and the
 * event does not follow: scroll 200px mid-drag and the drop lands 200px —
 * three and a half hours — from where it looks like it will. That is true of a
 * wheel and of every auto-scrolled drag below.
 *
 * Measured from the COLUMN's own top edge rather than from the scroller's
 * scrollTop, which is the same cost and answers the question actually being
 * asked. scrollTop only sees this scroller: once it reaches its end a wheel
 * chains to the page outside the iframe, which moves the grid just as far
 * while scrollTop does not change at all. The column's rect moves whatever
 * the reason — either scroller, or a reflow.
 */
function dragDeltaY() {
  const { colEl, startColTop, startY, lastY } = dragState;
  const gridShift = colEl?.isConnected ? startColTop - colEl.getBoundingClientRect().top : 0;
  return (lastY - startY) + gridShift;
}

/** Left edge of the column for `date`, or null if that day is not on screen. */
function columnLeftFor(columns, date) {
  return columns.find(c => c.date === date)?.left ?? null;
}

/**
 * Recompute the patch from where the pointer is now, and draw it.
 *
 * Reads the pointer position from dragState rather than taking it as an
 * argument, because the auto-scroll loop needs to redraw on a frame where no
 * pointer event happened at all — the finger is still, the grid is moving, and
 * the event has to keep up with it.
 */
function updateDragPreview() {
  if (!dragState?.moved || !dragState.box.isConnected) return;
  const { ev, edge, box, columns, originLeft, lastX } = dragState;
  const dy = dragDeltaY();

  // A resize holds the event on its own day. Dragging an edge sideways is not
  // a meaningful gesture, and honouring it would let one drag change both the
  // duration and the date.
  if (edge) {
    dragState.patch = applyResize(ev, edge, dy, HOUR_H);
    previewDrag(box, dragState.patch, 0, false);
    return;
  }

  const date = pickColumnDate(lastX, columns);
  dragState.patch = applyMoveAcrossDays(ev, dy, HOUR_H, date);
  const crossed = dragState.patch.start_date !== ev.start_date;
  const left = crossed ? columnLeftFor(columns, dragState.patch.start_date) : null;
  previewDrag(box, dragState.patch, left === null ? 0 : left - originLeft, crossed);
}

/**
 * Pull the grid when a drag reaches its top or bottom edge.
 *
 * Without this, moving an event from the morning to the evening means dropping
 * it, scrolling, and dragging again — the reachable range is one screenful.
 *
 * The loop runs for the rest of the gesture and does nothing on the frames the
 * pointer is not near an edge, which keeps the decision in one place instead
 * of starting and stopping a timer from the move handler. It redraws only when
 * the scroller actually moved: at the end of the range scrollTop stops
 * changing, and repainting an unchanged preview every frame is pure churn.
 */
function startAutoScroll() {
  if (dragState.rafId) return;
  const step = () => {
    if (!dragState?.active) return;
    dragState.rafId = requestAnimationFrame(step);
    const { scrollEl, lastY } = dragState;
    if (!scrollEl?.isConnected) return;
    const rect = scrollEl.getBoundingClientRect();
    const velocity = autoScrollVelocity(lastY, rect.top, rect.bottom);
    if (!velocity) return;
    const before = scrollEl.scrollTop;
    scrollEl.scrollTop = before + velocity;
    if (scrollEl.scrollTop === before) return;   // already at the end
    updateDragPreview();
  };
  dragState.rafId = requestAnimationFrame(step);
}

/**
 * Draw where the drop would land.
 *
 * Positioned from the PATCH rather than from the raw pointer, so the box
 * visibly snaps to the quarter hour as it moves and what the member sees while
 * dragging is exactly what gets written.
 */
function previewDrag(box, patch, dx = 0, crossed = false) {
  const { start, end } = eventSpanMins(patch);
  box.style.top    = `${(start / 60) * HOUR_H}px`;
  box.style.height = `${Math.max(((end - start) / 60) * HOUR_H - 2, 18)}px`;
  // Slid sideways rather than re-parented into the target column. Moving the
  // node would re-pack the overlap columns of both days on every frame, for a
  // layout the drop re-renders correctly anyway — and it would detach the very
  // box this gesture is holding a pointer capture on.
  box.style.transform = dx ? `translateX(${dx}px)` : "";
  if (dragState) dragState.previewDx = dx;
  let label = box.querySelector(".tg-ev-ghost-time");
  if (!label) {
    label = document.createElement("div");
    label.className = "tg-ev-ghost-time";
    label.dataset.testid = "tg-drag-time";
    box.appendChild(label);
  }
  const time = `${fmtTime(patch.start_time)} – ${fmtTime(patch.end_time)}`;
  // The day only appears once the drag has left its own column: naming the
  // current day on every ordinary vertical drag is noise.
  label.textContent = crossed ? `${fmtDateShort(patch.start_date)} · ${time}` : time;
}

function onDragPointerUp(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  const { moved, patch, ev, box, previewDx } = dragState;
  endDrag();
  // Same reason as the move handler: a drop onto a grid that no longer exists
  // is not a drop the member made against what they were looking at.
  if (!box.isConnected) return;
  if (!moved || !patch) return;
  // The click still has to be swallowed either way: the gesture happened, and
  // letting it through would open the detail modal on a drop.
  swallowNextClick();
  // Dropped back where it started — within a snap of it, anyway. There is
  // nothing to write, and writing it anyway would bump updated_at and could
  // raise a conflict dialog over a move that never happened.
  if (isNoopDragPatch(ev, patch)) { renderPreservingScroll(); return; }
  // endDrag() has just reset the box to its own column. Normally invisible —
  // the commit's optimistic render runs on the microtask that follows, before
  // the browser paints. But the conflict dialog AWAITS, and across that await
  // the member would be looking at an event showing its new time back on its
  // old day. Put the offset back and let the render, which every branch of the
  // commit reaches, be what clears it.
  if (previewDx) box.style.transform = `translateX(${previewDx}px)`;
  commitDrag(ev, patch);
}

/**
 * A cancelled pointer is an ABANDONED drag, not a dropped one.
 *
 * The browser emits pointercancel when it takes the gesture over for itself —
 * a scroll it decided to own, a system gesture, the touch interrupted by a
 * call. The member never let go anywhere. Routed through onDragPointerUp this
 * would persist whatever position the preview had reached and reschedule an
 * event nobody meant to move.
 */
function onDragPointerCancel(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  abandonDrag();
}

/**
 * End a drag that will not be persisted, and undo what it drew.
 *
 * previewDrag() writes straight to the box's inline top/height, so a drag
 * dropped on the floor leaves the event sitting at a position nothing has
 * saved. Every path that gives up on a gesture goes through here — a cancelled
 * pointer, and a second pointer arriving mid-drag.
 */
function abandonDrag() {
  // Only worth a re-render if a preview is actually still on screen: a box
  // that has already been replaced by someone else's render has nothing left
  // to undo, and rendering again would be pure churn.
  const previewed = Boolean(dragState?.moved) && dragState.box.isConnected;
  endDrag();
  if (previewed) renderPreservingScroll();
}

function endDrag() {
  if (!dragState) return;
  const { box, armTimer, pointerId, rafId } = dragState;
  if (armTimer) clearTimeout(armTimer);
  // The loop bails on a null dragState anyway, but leaving a frame queued for
  // every drag of the session is a callback that outlives its reason to exist.
  if (rafId) cancelAnimationFrame(rafId);
  try { box.releasePointerCapture(pointerId); } catch { /* already released */ }
  box.classList.remove("dragging", "armed");
  // Inline styles previewDrag wrote. top/height are overwritten by the next
  // render, but a transform left behind would offset the box against a column
  // it is no longer being dragged out of.
  box.style.transform = "";
  box.querySelector(".tg-ev-ghost-time")?.remove();
  dragState = null;
  window.removeEventListener("pointermove", onDragPointerMove);
  window.removeEventListener("pointerup", onDragPointerUp);
  window.removeEventListener("pointercancel", onDragPointerCancel);
  window.removeEventListener("touchmove", onDragTouchMove, { passive: false });
  window.removeEventListener("resize", onViewportResize);
}

/**
 * Re-render without throwing the grid back to its default scroll position.
 *
 * renderTimeGrid scrolls to now (or 7am) every time it builds, which is right
 * when the member navigates and wrong when a drag redraws under their hands:
 * dropping an afternoon event in a week that is not this one would scroll it
 * straight out of view.
 */
function renderPreservingScroll() {
  const top = document.getElementById("tg-scroll")?.scrollTop;
  render();
  if (top === undefined) return;
  const el = document.getElementById("tg-scroll");
  if (el) el.scrollTop = top;
}

/**
 * Wait for an in-flight drag write on this event to settle, so no other
 * mutation of the same row is ever in flight beside it.
 */
const settlePendingDrag = (id) => pendingDrags.settle(id);

/** Run a drag's write under registration. */
function commitDrag(ev, patch) {
  return pendingDrags.run(ev.id, (entry) => runDragCommit(ev, patch, entry));
}

async function runDragCommit(ev, patch, entry) {
  // Hoisted: the catch-all at the bottom needs it to undo an optimistic move
  // that a failure outside the write itself left on screen.
  let restore = null;
  try {
    // A resize patch carries no dates. Filling them in from the row keeps the
    // three LOCAL things that must agree in agreement — what goes on screen,
    // what a reload reapplies, and what the conflict check is run against.
    // It deliberately does NOT decide what the UPDATE sends; see movesDay.
    const full = {
      ...patch,
      start_date: patch.start_date ?? ev.start_date,
      end_date: patch.end_date ?? ev.end_date ?? ev.start_date,
    };
    // The columns this gesture CHANGED, and no others. `full` is the whole
    // resulting span and is right for the conflict check below, but it is the
    // wrong thing to write or to re-apply: it carries the dates as they looked
    // when the finger went down. A resize cannot move a day, so sending them
    // would let it silently undo a day move someone else made while it was in
    // flight — over the wire AND on screen, where withPendingDrags re-applies
    // this patch to rows a reload has just brought back fresh.
    const movesDay = dragChangesDate(ev, patch);
    const changes = movesDay
      ? {
          start_time: full.start_time, end_time: full.end_time,
          start_date: full.start_date, end_date: full.end_date,
        }
      : { start_time: full.start_time, end_time: full.end_time };
    // The same attendee-conflict check the edit form runs. Without it the
    // identical schedule change is stopped for confirmation through Edit and
    // waved through by a drag. findConflictsFor pools by `start_date`, so a
    // cross-day drag is checked against the day it LANDS on, not the one it
    // left — the reason `full` is built before this and not after.
    const conflicts = findConflictsFor({ ...ev, ...full }, new Set([ev.id]));
    if (conflicts.length) {
      const ok = await hubConfirm("Schedule conflict", {
        description: describeConflicts(conflicts),
        confirmLabel: "Move anyway",
      });
      if (!ok) {
        // Nothing was written, but the box is still where the preview left it.
        renderPreservingScroll();
        return;
      }
    }

    const now = new Date().toISOString();
    // Only this row's prior times, not a snapshot of the whole array: a
    // wholesale restore would also undo a different event's drag that
    // succeeded while this one was in flight.
    const prior = localEvents.find(e => e.id === ev.id);
    // Derived from `changes` rather than listed again, so an undo can never
    // cover more columns than the change it is undoing.
    restore = prior
      ? Object.fromEntries([...Object.keys(changes), "updated_at"].map(k => [k, prior[k]]))
      : null;
    localEvents = localEvents.map(e => e.id === ev.id ? { ...e, ...changes, updated_at: now } : e);
    entry.patch = changes;   // now on screen, so worth restoring after a reload
    renderPreservingScroll();
    try {
      // Guarded on the same conditions isDraggableEvent checked: a row a sync
      // re-sourced or a cancellation retired since the grid was drawn must not
      // be rewritten by a drag aimed at what it used to be.
      // start_date and end_date are `_date`-suffixed, so the app-DB codec
      // leaves them plaintext — they are safe to write as parameters and, if
      // it ever came to it, to compare in a predicate.
      const { changed } = movesDay
        ? await db(
            `UPDATE app_calendar__events SET start_time=?,end_time=?,start_date=?,end_date=?,updated_at=? WHERE id=? AND source='local' AND is_cancelled=0`,
            [changes.start_time, changes.end_time, changes.start_date, changes.end_date, now, ev.id],
          )
        : await db(
            `UPDATE app_calendar__events SET start_time=?,end_time=?,updated_at=? WHERE id=? AND source='local' AND is_cancelled=0`,
            [changes.start_time, changes.end_time, now, ev.id],
          );
      // A row policy refuses a write by NARROWING the UPDATE's predicate, not
      // by erroring: a refusal is HTTP 200 with changed: 0, which db() cannot
      // throw on. Without this the optimistic move stands, looks saved, and
      // quietly reverts on the next load.
      //
      // It is NOT only a refusal, though, and that is why this does not throw
      // into the rollback below. The predicate also stops matching when the
      // row is gone, cancelled, or re-sourced by a sync since the grid was
      // drawn — cases where the local copy the rollback would restore is
      // itself the stale thing, left on screen and draggable again. The
      // authoritative rows are the only honest answer to "what happened", so
      // re-read them.
      if (DB && !changed) {
        // This move is not happening. Retire the patch before the await below:
        // while it is in flight, another event's reload would otherwise call
        // withPendingDrags and put this failed position back on screen.
        entry.patch = null;
        let refreshed = false;
        // Other events' in-flight drags survive this re-read; this one's does
        // not, which is what makes it authoritative.
        try { await loadLocalEvents(ev.id); refreshed = true; } catch { /* fall back below */ }
        if (!refreshed && restore) {
          // Better the pre-drag position than the optimistic one, which is the
          // one position we know is wrong.
          localEvents = localEvents.map(e => e.id === ev.id ? { ...e, ...restore } : e);
        }
        renderPreservingScroll();
        showDragError(refreshed
          ? "This event could not be moved. It may have been changed or removed — the calendar has been refreshed."
          : "This event could not be moved, and the calendar could not be refreshed. Reload to see its current state.");
        return;
      }
    } catch (err) {
      entry.patch = null;   // failed: never let a reload reapply it
      if (restore) localEvents = localEvents.map(e => e.id === ev.id ? { ...e, ...restore } : e);
      renderPreservingScroll();
      showDragError(err?.message || "This event could not be moved.");
    }
  } catch (err) {
    // This function must never reject. The drop handler does not await it —
    // it cannot, a drop is not a place to block — so a rejection escaping here
    // would surface as nothing but an unhandled promise rejection, and
    // settlePendingDrag's waiters would be left to swallow it too.
    if (entry.patch && restore) localEvents = localEvents.map(e => e.id === ev.id ? { ...e, ...restore } : e);
    entry.patch = null;
    renderPreservingScroll();
    showDragError(err?.message || "This event could not be moved.");
  }
  // No finally: the entry is retired by commitDrag, which owns it.
}

let dragErrorTimer = null;
function showDragError(message) {
  document.getElementById("drag-error")?.remove();
  const box = document.createElement("div");
  box.id = "drag-error";
  box.className = "tg-drag-error";
  box.dataset.testid = "drag-error";
  box.setAttribute("role", "status");
  box.textContent = message;
  document.body.appendChild(box);
  clearTimeout(dragErrorTimer);
  dragErrorTimer = setTimeout(() => box.remove(), 5000);
}

function renderDay() { renderTimeGrid([toDateStr(pivot)]); }
function renderWeek() {
  const ws = getWeekStart(pivot);
  renderTimeGrid(Array.from({length:7}, (_,i) => toDateStr(addDaysObj(ws, i))));
}

function switchToDay(ds) {
  pivot = parseLD(ds);
  viewMode = "day";
  render();
}
window.switchToDay = switchToDay;

// ─── Agenda view ──────────────────────────────────────────────────────────
function renderAgenda() {
  // Browsing shows the next 60 days. A search widens the window to a year
  // either side — localEvents holds every event, so the only limit is how far
  // recurrence is worth expanding.
  const start = searchQ ? addDayStr(toDateStr(pivot), -365) : toDateStr(pivot);
  const end   = addDayStr(start, searchQ ? 730 : 60);
  const all = eventsForRange(start, end);
  const evs = searchQ ? all.filter(ev => searchMatch(searchQ, searchableFields(ev))) : all;
  const searchRow = `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search events…" aria-label="Search events" value="${esc(searchQ)}" /></div>`;
  if (!evs.length) {
    document.getElementById("root").innerHTML = searchRow + (searchQ
      ? `<div class="agenda-empty" data-testid="agenda-empty">No events match "${esc(searchQ)}" within a year either way.</div>`
      : `<div class="agenda-empty" data-testid="agenda-empty">No events in the next 60 days.</div>`);
    restoreSearchCaret();
    return;
  }
  const today = todayStr();
  let lastDate = null, html = "";
  for (const ev of evs) {
    if (ev._date !== lastDate) {
      const d = parseLD(ev._date), isT = ev._date === today;
      const label = isT ? "Today" : ev._date === addDayStr(today,1) ? "Tomorrow"
        : d.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" });
      html += `<div class="agenda-day-heading${isT?" today-heading":""}" data-testid="agenda-day-heading" data-date="${ev._date}"><span class="day-num">${d.getDate()}</span>${label}</div>`;
      lastDate = ev._date;
    }
    const timeStr = ev.all_day ? "All day" : [fmtTime(ev.start_time), fmtTime(ev.end_time)].filter(Boolean).join(" – ");
    const meta = [ev.location, ev.description].filter(Boolean).map(s => s.slice(0,80)).join(" · ");
    html += `<div class="agenda-event${ev.source==="synced"?" synced":ev.source==="cross-app"?" cross-app":""}"
      data-testid="agenda-event" data-event-id="${esc(ev.id)}" data-date="${ev._date}"
      onclick="_showEvByKey(${_regEv(ev,ev._date)})">
      <div class="ev-color-bar" style="background:${esc(ev.color)}"></div>
      <div class="agenda-time">${timeStr}</div>
      <div class="agenda-body">
        <div class="agenda-title" data-testid="agenda-title">${esc(ev.title)}</div>
        ${meta ? `<div class="agenda-meta">${esc(meta)}</div>` : ""}
        ${avatarStack(ev)}
      </div>
    </div>`;
  }
  document.getElementById("root").innerHTML = searchRow + `<div class="agenda" data-testid="agenda">${html}</div>`;
  restoreSearchCaret();
}

// renderAgenda rewrites #root, so the box has to be refocused after a keystroke.
function restoreSearchCaret() {
  if (!searchQ) return;
  const el = document.getElementById("search");
  if (el) { el.focus(); el.setSelectionRange(searchQ.length, searchQ.length); }
}

document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  renderAgenda();
});

// ─── Day panel ────────────────────────────────────────────────────────────
function openDayPanel(dateStr) {
  _evReg = [];
  closePanels();
  const evs = eventsForRange(dateStr, dateStr);
  const dLabel = parseLD(dateStr).toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric", year:"numeric" });
  const isToday = dateStr === todayStr();
  const evRows = evs.map(ev => {
    const timeStr = ev.all_day ? "All day" : fmtTime(ev.start_time) + (ev.end_time ? " – " + fmtTime(ev.end_time) : "");
    return `<div class="day-panel-event" data-testid="day-panel-event" data-event-id="${esc(ev.id)}" onclick="_showEvByKey(${_regEv(ev,dateStr)})">
      <div style="width:4px;background:${esc(ev.color)};border-radius:2px;flex-shrink:0;align-self:stretch"></div>
      <div class="time">${timeStr}</div>
      <div><div class="ev-title" data-testid="day-panel-event-title">${esc(ev.title)}</div>${ev.location ? `<div class="ev-loc">${esc(ev.location)}</div>` : ""}${avatarStack(ev)}</div>
    </div>`;
  }).join("") || `<div data-testid="day-panel-empty" style="color:var(--muted);font-size:.85rem;padding:8px 0">No events.</div>`;
  // Who's busy: every member attached to an event this day, with a count.
  const busyCounts = new Map();
  for (const ev of evs) for (const id of memberIdsOf(ev)) {
    if (members.some(m => m.id === id)) busyCounts.set(id, (busyCounts.get(id) ?? 0) + 1);
  }
  const busyHtml = busyCounts.size ? `<div class="busy-strip">${[...busyCounts].map(([id, n]) => {
    const m = members.find(x => x.id === id);
    return `<span class="busy-chip"><span class="attendee-av" style="background:${memberColor(id, members)}">${initial(m.name)}</span>${esc(m.name)}<span class="busy-n">· ${n}</span></span>`;
  }).join("")}</div>` : "";
  panelEl = document.createElement("div");
  panelEl.className = "day-panel-backdrop";
  panelEl.innerHTML = `<div class="day-panel" data-testid="day-panel" data-date="${dateStr}">
    <div class="day-panel-header">
      <div class="day-panel-title" data-testid="day-panel-title">${isToday ? "Today — " : ""}${dLabel}</div>
      <button class="btn btn-ghost btn-sm" data-testid="day-panel-close" onclick="closePanels()">✕</button>
    </div>
    ${busyHtml}
    ${evRows}
    ${canWrite ? `<div style="margin-top:12px">
      <button class="btn btn-primary btn-sm" data-testid="day-panel-add" onclick="closePanels();openCreateModal('${dateStr}')">+ Add event</button>
    </div>` : ""}
  </div>`;
  panelEl.addEventListener("click", e => { if (e.target === panelEl) closePanels(); });
  document.body.appendChild(panelEl);
}
function closePanels() { panelEl?.remove(); panelEl = null; }

// ─── Event detail ─────────────────────────────────────────────────────────

  closePanels(); closeModal();
  const primary = localEvents.find(e => e.id === primaryId) ?? syncedEvents.find(e => e.id === evId);
  const exception = localEvents.find(e => e.recurring_event_id === primaryId && e.original_date === occDate);
  const ev = exception ?? localEvents.find(e => e.id === evId) ?? primary;
  if (!ev) return;
  const _evDetailKey = _regEv(ev, dateStr);
  const isSynced = ev.source === "synced" || ev.source === "cross-app", isRecurring = !!primary?.recurrence;
  _detailEditId = primary?.id ?? ev.id; _detailOccDate = occDate; _detailIsRecurring = isRecurring;
  const ruleLabel = isRecurring ? describeRecurrence(JSON.parse(primary.recurrence)) : "";
  const attendees = JSON.parse(ev.attendee_ids || "[]");

  const dateRange = ev.start_date === ev.end_date ? fmtDate(ev.start_date, {weekday:true}) : `${fmtDateShort(ev.start_date)} – ${fmtDateShort(ev.end_date)}`;
  openModal(`
