  // to undo the preview, and the write below is about to do its own render
  // from authoritative rows.
  onModalClose = null;
  closeModal();
  if (!drop) return;
  commitSeriesDrag(drop, scope);
};

/**
 * The drop's rows as they are now, or null if the series can no longer take it.
 *
 * A primary that has lost its rule is the refusal that matters: the occurrence
 * the member dragged does not exist any more, and every scope here would write
 * the rule back on to a row someone has deliberately made a plain event.
 */
// The override standing in for one date of a series, if there is one. Written
// out at five call sites before this, which is how the edit form came to test
// for one on a row that never carries it.
function findOverride(primaryId, occDate) {
  return localEvents.find(e => e.recurring_event_id === primaryId && e.original_date === occDate);
}

function refreshDrop(drop) {
  const primary = localEvents.find(e => e.id === drop.primaryId);
  if (!primary?.recurrence) return null;
  const ev = liveOccurrence(primary, drop.ev, drop.occDate);
  if (!ev) return null;
  // Refusing here is the point, and re-reading is how the change is DETECTED
  // rather than how it is repaired.
  //
  // `patch` is absolute — applyMove() run against the times the row had at
  // pointerdown — and it is the one thing in `drop` this function does not
  // refresh, because there is nothing to recompute it from once the finger is
  // up. So handing the writers a refreshed `updated_at` alongside it would let
  // the predicate certify a payload that was computed from times that are no
  // longer there: arithmetic on a number someone has since replaced, admitted
  // by a version that says nothing changed. The guard would pass and the other
  // member's edit would be overwritten by a drag that never saw it.
  //
  // A version that moved while the picker was open therefore ends the drop.
  // The member is told the series changed, sees the refreshed calendar, and
  // can drag again from what is actually there.
  if (dropIsStale(drop, primary, ev)) return null;
  return { ...drop, primary, ev };
}

/**
 * The statement that CLAIMS a series for a write, at the version it was read at.
 *
 * Paired with `requireChanges` it does two jobs at once. It refuses a write
 * built from a snapshot the series has moved past — a rule someone re-cut, a
 * time someone changed — and it serializes the writes that have nothing of
 * their own to contend on: creating an override INSERTs a row, and
 * `(recurring_event_id, original_date)` carries only a NON-unique index, so
 * two members can each add one for the same occurrence and the expansion —
 * which keys exMap by that date — will quietly draw one and drop the other.
 * Bumping the primary's version makes it the row they contend on instead.
 *
 * A UNIQUE index would be the tighter answer, and is deliberately not taken:
 * the column pair holds live data, so the migration could only be made safe by
 * DELETING one of two member-authored overrides — and which one is visible
 * today depends on list order, so there is no "the wrong one" to pick.
 */


/** Run a recurring drop's write under registration, keyed on the series. */
function commitSeriesDrag(drop, scope) {
  return pendingDrags.run(drop.primaryId, () => runSeriesDragCommit(drop, scope));
}

/**
 * Whether a guarded write actually matched a row.
 *
 * `changed` is a number for every real statement; it is absent only where
 * there is no database at all, and nothing is refused there.
 */
const didApply = (res) => res?.changed !== 0;

/**
 * Run a batch whose FIRST statement is a guard that may legitimately refuse.
 *
 * `requireChanges` is what makes a zero-match UPDATE abort the transaction.
 * Without it a batch is atomic only against errors: a guard statement that
 * matches nothing succeeds, reports `changed: 0`, and every statement after it
 * still commits — which is how "the series could not be moved" and "a new
 * series was created anyway" became the same outcome.
 *
 * A refused guard rolls the batch back and comes back as a 409. That is a
 * refusal, not a failure, and it belongs here as `false` rather than as a
 * thrown error carrying server copy written for a log.
 */
async function guardedBatch(statements) {
  // requireChanges is applied HERE, to every UPDATE in the batch, rather than
  // being spelled at each statement. A multi-statement batch in this file is
  // always a set of writes that only mean anything together — cap a series and
  // create its tail, claim a parent and insert its override — and a batch is
  // atomic against ERRORS, not against a statement matching nothing. So an
  // unflagged UPDATE in one of these is never a deliberate "may match zero";
  // it is the bug, twice found by review and once by a mutation. Making it the
  // batch's property rather than the caller's is what stops there being a
  // third.
  //
  // UPDATE only, deliberately. DELETE is the one shape here that IS allowed to
  // match nothing: "this and following" clears the overrides at or after the
  // split, and a series that simply has none is the ordinary case, not a lost
  // race. INSERTs are skipped because requireChanges is UPDATE/DELETE-only and
  // the hub rejects it on anything else. A statement that says requireChanges
  // itself keeps what it says.
  const guarded = statements.map(st =>
    /^\s*UPDATE\b/i.test(st.sql) && st.requireChanges === undefined
      ? { ...st, requireChanges: true } : st);
  try {
    await dbBatch(guarded);
    // Nothing to inspect in the results: a guard that matched nothing has
    // already thrown, so reaching here IS the statement having applied.
    return true;
  } catch (err) {
    if (err?.status === 409) return false;
    throw err;
  }
}

/**
 * Save a recurring occurrence's new time under the scope the member picked.
 *
 * Pessimistic throughout, unlike a standalone drag. Two of the three scopes
 * are multi-row operations — an exception upsert, a series split — whose
 * result is not something to guess at; and the member has just spent a modal
 * deciding, so the instant feedback an optimistic move buys was already gone.
 * It also leaves the registry entry's `patch` null, which is what stops a
 * reload landing mid-write from putting a position on screen that nothing has
 * agreed to.
 */
async function runSeriesDragCommit(drop, scope) {
  try {
    // Everything in `drop` was captured when the finger went down, and the
    // scope picker then sat open for as long as the member took to decide.
    // That is long enough for a form save, another member, or a sync to land,
    // and the snapshot is fine for drawing a preview but wrong for writing:
    // `primary.recurrence` is written back verbatim by a split, so a stale
    // copy would re-add a rule someone has just removed.
    const fresh = refreshDrop(drop);
    if (!fresh) {
      try { await loadLocalEvents(); } catch { /* the message covers it */ }
      renderPreservingScroll();
      showWriteError("This event could not be moved. Its series has changed — the calendar has been refreshed.");
      return;
    }
    const { ev, primary, primaryId, occDate, patch } = fresh;
    // The whole series is excluded, not just the row under the finger:
    // findMemberConflicts also skips anything whose _primaryId is excluded, so
    // the primary's id covers every virtual occurrence, and the stored
    // exceptions are named directly.
    //
    // Checked against the dropped DATE only. That is the same reach the edit
    // form has for the same scopes — a check that spans "all events" would
    // have to expand the whole series — and it is the date the member is
    // looking at.
    const seriesIds = new Set([
      primaryId,
      ...localEvents.filter(e => e.recurring_event_id === primaryId).map(e => e.id),
    ]);
    // Decided before the conflict check, because WHICH rows a scope writes is
    // what the check has to be run against. Splitting at the FIRST occurrence
    // moves every occurrence there is, which is "all events" — and routing it
    // there avoids leaving the original row behind as a series whose rule now
    // ends before it starts: invisible in every view, so impossible to delete.
    const wholeSeries = scope === "all"
      || (scope === "following" && occDate === primary.start_date);
    // What the chosen scope will WRITE, which for a split is not the occurrence
    // under the finger — see seriesConflictCandidate.
    const candidate = seriesConflictCandidate({ scope, wholeSeries, ev, primary, patch, occDate });
    const conflicts = findConflictsFor(candidate, seriesIds);
    if (conflicts.length) {
      const ok = await hubConfirm("Schedule conflict", {
        description: describeConflicts(conflicts),
        confirmLabel: "Move anyway",
      });
      if (!ok) { renderPreservingScroll(); return; }
    }

    const now = new Date().toISOString();
    const applied = wholeSeries        ? await moveWholeSeries(primary, ev, patch, now)
                  : scope === "this"   ? await moveOneOccurrence(primary, ev, occDate, patch, now)
                  :                      await moveFollowing(primary, occDate, patch, now);

    // Nothing optimistic went on screen, so this re-read is not a rollback —
    // it is the only thing that makes the result visible. It also corrects the
    // preview, which is still sitting at the dropped position whether the
    // write applied or not.
    try { await loadLocalEvents(); } catch { /* reported below either way */ }
    renderPreservingScroll();
    if (!applied) {
      showWriteError("This event could not be moved. It may have been changed or removed — the calendar has been refreshed.");
    }
  } catch (err) {
    // Never rejects, for the reason runDragCommit gives: nothing awaits this,
    // so a rejection would surface as nothing but an unhandled one.
    renderPreservingScroll();
    showWriteError(err?.message || "This event could not be moved.");
  }
}

/**
 * "All events" — the series' own time moves, so every occurrence it generates
 * moves with it.
 *
 * Exception rows OTHER than the dragged one keep the times they were given,
 * which is the answer the edit form's "all" scope gives too: an override is a
 * decision about one date, and a series-wide change is not a reason to throw
 * it away. The dragged one is the exception to that, below.
 *
 * Guarded on the same conditions isDraggableEvent checked, for the same reason
 * the standalone drag is: a row a sync re-sourced or a cancellation retired
 * since the grid was drawn must not be rewritten by a drag aimed at what it
 * used to be — plus `updated_at`, which is the version this write was computed
 * FROM. The patch is applyMove() run against the snapshot's own start_time, so
 * a time someone else changed in the meantime makes the result arithmetic on a
 * number that no longer exists. `updated_at` is `_at`-suffixed and therefore
 * plaintext, which is what lets it be a predicate at all.
 */
async function moveWholeSeries(primary, ev, patch, now) {
  const moveTo = row => updateEvent({
    id: row.id, version: row.updated_at, now,
    set: { start_time: patch.start_time, end_time: patch.end_time },
  });
  // The occurrence under the finger is written alongside the series when it is
  // a stored exception. Without this, the one box the member actually dragged
  // is the one box that does not move — its own times outrank the series' — and
  // "all events" visibly skips it. Two statements, one transaction: a series
  // moved without its exception is exactly the half-state this avoids.
  if (!isSeriesException(ev)) {
    const stmt = moveTo(primary);
    return didApply(await db(stmt.sql, stmt.params));
  }
  // requireChanges on BOTH, not a check on the results afterwards. Either
  // guarded UPDATE can match nothing on its own — the series deleted, the
  // override cancelled — and reading that back after the fact detects a series
  // moved without its exception without being able to undo it.
  return guardedBatch([
    moveTo(primary),
    moveTo(ev),
  ]);
}

/**
 * "This event" — one date is overridden and the rule is untouched.
 *
 * An upsert, because the occurrence may already have an exception row (it was
 * renamed once before) or may still be purely virtual. The INSERT copies the
 * PRIMARY's columns rather than the occurrence's: for a virtual occurrence the
 * two differ only in the dates, and those are passed explicitly.
 *
 * `original_date` is the date the RULE generated, which is what pins the
 * override to the occurrence it replaces — not the date the row shows, which a
 * later edit may move.
 */
async function moveOneOccurrence(primary, ev, occDate, patch, now) {
  const existing = findOverride(primary.id, occDate);
  if (existing) {
    // Claims the parent as well, for the reason the edit form's matching
    // branch gives: an override only means anything while the series that
    // generates its date still stands, so a parent dissolved or truncated
    // while the picker was open would leave this write succeeding against a
    // row that is no longer drawn anywhere — and an override is only ever
    // drawn THROUGH its parent.
    return guardedBatch([
      claimSeries(primary, now),
      updateEvent({
        id: existing.id, version: existing.updated_at, now,
        set: { start_time: patch.start_time, end_time: patch.end_time },
      }),
    ]);
  }
  // `visibility` is carried explicitly and is not optional. The column defaults
  // to 'everyone' and the row policy reads it, so an override created for a
  // series that is NOT 'everyone' would be published to the whole household by
  // a gesture that only meant to move it by an hour. The app's own form writes
  // no other value today, but seeds, automations and imports all can.
  return guardedBatch([
    // The INSERT has nothing to guard on — there is no row yet to narrow a
    // predicate against — so the primary is touched first, under
    // requireChanges, and does two jobs.
    //
    // It asserts the parent is still there. refreshDrop checked the same thing
    // against the LOCAL rows, which is a snapshot; a delete landing between
    // that check and this write would leave an override whose parent is gone,
    // and an override is only ever drawn THROUGH its parent — so the row would
    // be invisible in every view and impossible to remove.
    //
    // And it SERIALIZES override creation. `original_date` carries only a
    // non-unique index, so nothing in the schema stops two members creating an
    // override for the same occurrence at once — and the expansion keys exMap
    // by that date, so the loser is not a visible duplicate but a row that
    // silently disappears. Matching `updated_at` and then bumping it makes the
    // primary the row they contend on: the first batch moves the version, the
    // second no longer matches it and rolls back.
    //
    // The bump is not a side effect to apologize for: the series did just
    // change, by acquiring an override.
    claimSeries(primary, now),
    insertOverride({
      id: crypto.randomUUID(), primary, occDate, actor: ME?.id ?? null, now,
      values: { ...primary, start_date: ev.start_date, end_date: ev.end_date,
                start_time: patch.start_time, end_time: patch.end_time },
    }),
  ]);
}

/**
 * "This and following" — the series is split in two at this date.
 *
 * One transaction, because the halves only mean anything together: capping
 * without creating silently truncates the series, and creating without capping
 * leaves two series overlapping on the same dates, each showing the other's
 * occurrences.
 *
 * Exception rows on or after the split are NOT re-pointed at the new series.
 * They keep `recurring_event_id` on the original primary, whose rule no longer
 * reaches their dates, so the expansion stops drawing them — the same thing
 * the edit form's "following" scope does, and the same thing that makes a
 * split reversible only by editing, not by splitting back.
 */
async function moveFollowing(primary, occDate, patch, now) {
  const rule = JSON.parse(primary.recurrence ?? "{}");
  // How many occurrences fall before the split. Only the expansion can answer
  // that, and splitRecurrence needs it to divide a COUNTED rule between the
  // two halves instead of handing each of them the original total.
  const preceding = occurrencesInRange(
    primary.start_date, rule, primary.start_date, addDayStr(occDate, -1),
  ).length;
  const { head, tail } = splitRecurrence(rule, occDate, preceding);
  return guardedBatch([
    // requireChanges, because atomic is not the same as all-or-nothing here: a
    // cap that matches no rows — the series deleted, cancelled, or re-sourced
    // since the grid was drawn — is not an error, so without this the INSERT
    // below still commits and the member is told the move failed while a brand
    // new series quietly appears beside the one they were looking at.
    updateEvent({ id: primary.id, version: primary.updated_at, now,
      set: { recurrence: JSON.stringify(head) } }),
    // Same reason as the override INSERT: the tail of a series that is not
    // 'everyone' must not become 'everyone' because someone dragged it.
    insertSeries({
      id: crypto.randomUUID(), primary, actor: ME?.id ?? null, now,
      values: { ...primary, start_date: occDate, end_date: occDate,
                start_time: patch.start_time, end_time: patch.end_time,
                recurrence: JSON.stringify(tail) },
    }),
  ]);
}

let dragErrorTimer = null;
/**
 * The app's one "that write did not happen" surface.
 *
 * Named for drags when only drags could be refused; the form's recurring
 * scopes now claim a series the same way and can be told no the same way, so
 * the name and the testid follow the meaning rather than the first caller.
 */
function showWriteError(message) {
  document.getElementById("write-error")?.remove();
  const box = document.createElement("div");
  box.id = "write-error";
  box.className = "tg-drag-error";
  box.dataset.testid = "write-error";
  box.setAttribute("role", "status");
  box.textContent = message;
  document.body.appendChild(box);
  clearTimeout(dragErrorTimer);
  dragErrorTimer = setTimeout(() => box.remove(), 5000);
}

function renderDay() { renderTimeGrid([toDateStr(pivot)]); }
function renderWeek() {
  const ws = getWeekStart(pivot);
  renderTimeGrid(Array.from({length:7}, (_,i) => toDateStr(addDaysObj(ws, i))));
}

function switchToDay(ds) {
  pivot = parseLD(ds);
  viewMode = "day";
  render();
}
window.switchToDay = switchToDay;

// ─── Agenda view ──────────────────────────────────────────────────────────
function renderAgenda() {
  // Browsing shows the next 60 days. A search widens the window to a year
  // either side — localEvents holds every event, so the only limit is how far
  // recurrence is worth expanding.
  const start = searchQ ? addDayStr(toDateStr(pivot), -365) : toDateStr(pivot);
  const end   = addDayStr(start, searchQ ? 730 : 60);
  const all = eventsForRange(start, end);
  const evs = searchQ ? all.filter(ev => searchMatch(searchQ, searchableFields(ev))) : all;
  const searchRow = `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search events…" aria-label="Search events" value="${esc(searchQ)}" /></div>`;
  if (!evs.length) {
    document.getElementById("root").innerHTML = searchRow + (searchQ
      ? `<div class="agenda-empty" data-testid="agenda-empty">No events match "${esc(searchQ)}" within a year either way.</div>`
      : `<div class="agenda-empty" data-testid="agenda-empty">No events in the next 60 days.</div>`);
    restoreSearchCaret();
    return;
  }
  const today = todayStr();
  let lastDate = null, html = "";
  for (const ev of evs) {
    if (ev._date !== lastDate) {
      const d = parseLD(ev._date), isT = ev._date === today;
      const label = isT ? "Today" : ev._date === addDayStr(today,1) ? "Tomorrow"
        : d.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" });
      html += `<div class="agenda-day-heading${isT?" today-heading":""}" data-testid="agenda-day-heading" data-date="${ev._date}"><span class="day-num">${d.getDate()}</span>${label}</div>`;
      lastDate = ev._date;
    }
    const timeStr = ev.all_day ? "All day" : [fmtTime(ev.start_time), fmtTime(ev.end_time)].filter(Boolean).join(" – ");
    const meta = [ev.location, ev.description].filter(Boolean).map(s => s.slice(0,80)).join(" · ");
    html += `<div class="agenda-event${ev.source==="synced"?" synced":ev.source==="cross-app"?" cross-app":""}"
      data-testid="agenda-event" data-event-id="${esc(ev.id)}" data-date="${ev._date}"
      onclick="_showEvByKey(${_regEv(ev,ev._date)})">
      <div class="ev-color-bar" style="background:${esc(ev.color)}"></div>
      <div class="agenda-time">${timeStr}</div>
      <div class="agenda-body">
        <div class="agenda-title" data-testid="agenda-title">${esc(ev.title)}</div>
        ${meta ? `<div class="agenda-meta">${esc(meta)}</div>` : ""}
        ${avatarStack(ev)}
      </div>
    </div>`;
  }
  document.getElementById("root").innerHTML = searchRow + `<div class="agenda" data-testid="agenda">${html}</div>`;
  restoreSearchCaret();
}

// ─── Conflict warning ─────────────────────────────────────────────────────
// First save click with attendee conflicts shows a warning and flips the
// button to "… anyway"; the second click proceeds. Reset on every modal open.
let conflictAck = false;
/**
 * Attendees double-booked by a proposed change. Detection only — no DOM — so
 * the modal warning and the drag confirmation ask the same question of the
 * same data instead of each deciding for themselves what counts as a clash.
 */
function findConflictsFor(data, excludeIds = new Set()) {
  let attendees = [];
  try { attendees = JSON.parse(data.attendee_ids || "[]"); } catch { /* no attendees */ }
  if (!attendees.length) return [];
  const pool = eventsForRange(data.start_date, data.end_date || data.start_date, { filtered: false });
  return findMemberConflicts(data, attendees, pool, excludeIds);
}

/** One conflict as plain text. Escaped by the caller that needs markup. */
function conflictLine({ event: ev, memberIds }) {
  const names = memberIds.map(id => members.find(m => m.id === id)?.name ?? "Someone").join(", ");
  const time = (ev.all_day || !ev.start_time) ? "all day"
    : [fmtTime(ev.start_time), fmtTime(ev.end_time)].filter(Boolean).join(" – ");
  return `${names}: ${ev.title} (${fmtDateShort(ev._date ?? ev.start_date)}, ${time})`;
}

/** The conflict list as the hub confirm dialog's plain-text description. */
function describeConflicts(conflicts) {
  const lines = conflicts.slice(0, 4).map(conflictLine);
  if (conflicts.length > 4) lines.push(`…and ${conflicts.length - 4} more`);
  return lines.join("\n");
}

function warnConflicts(data, excludeIds = new Set()) {
  if (conflictAck) return false;
  const conflicts = findConflictsFor(data, excludeIds);
  if (!conflicts.length) return false;
  const items = conflicts.slice(0, 4).map(c => `<li>${esc(conflictLine(c))}</li>`).join("");
  const extra = conflicts.length > 4 ? `<li>…and ${conflicts.length - 4} more</li>` : "";
  let box = document.getElementById("conflict-warning");
  if (!box) {
    box = document.createElement("div");
    box.id = "conflict-warning";
    box.className = "conflict-box";
    box.dataset.testid = "conflict-warning";
    modalEl?.querySelector(".modal-actions")?.before(box);
  }
  box.innerHTML = `⚠️ <strong>Schedule conflict</strong><ul>${items}${extra}</ul>`;
  const btn = modalEl?.querySelector(".modal-actions .btn-primary");
  if (btn && !btn.textContent.endsWith("anyway")) btn.textContent += " anyway";
  conflictAck = true;
  return true;
}

function collectFormData() {
  const allDay = document.getElementById("ef-allday").checked;
  const freq   = document.getElementById("ef-freq").value;
  const endType = document.getElementById("ef-end-type")?.value ?? "never";
  const selDays = [...document.querySelectorAll(".day-toggle.selected")].map(b => b.dataset.day);
  const attendees = [...document.querySelectorAll(".attendee-btn.selected")].map(b => b.dataset.mid);
  let recurrence = null;
  if (freq !== "none") {
    const rule = { freq: freq === "biweekly" ? "weekly" : freq === "weekdays" ? "weekly" : freq, interval: freq === "biweekly" ? 2 : 1, end_type: endType };
    if (freq === "weekly" && selDays.length > 0) rule.days = selDays;
    if (freq === "weekdays") rule.days = ["mon","tue","wed","thu","fri"];
    if (endType === "count") rule.count = parseInt(document.getElementById("ef-count").value) || 10;
    if (endType === "date")  rule.end_date = document.getElementById("ef-end-date-rec").value;
    recurrence = JSON.stringify(rule);
  }
  return {
    title: document.getElementById("ef-title").value.trim(),
    description: document.getElementById("ef-desc").value.trim(),
    location: document.getElementById("ef-loc").value.trim(),
    start_date: document.getElementById("ef-start-date").value,
    start_time: allDay ? null : (document.getElementById("ef-start-time").value || null),
    end_date: document.getElementById("ef-end-date").value,
    end_time: allDay ? null : (document.getElementById("ef-end-time").value || null),
    all_day: allDay ? 1 : 0,
    color: document.getElementById("ef-color").value,
    attendee_ids: JSON.stringify(attendees),
    recurrence,
  };
}
function openCreateModal(defaultDate = null) {
  openModal(`<div class="modal-header"><h3>New Event</h3><button class="btn btn-ghost btn-sm" data-testid="modal-close" onclick="closeModal()">✕</button></div>

      <button class="btn btn-ghost" data-testid="modal-cancel" onclick="closeModal()">Cancel</button>

    </div>`, "event-create-modal");
}
window.submitCreate = async function() {
  const data = collectFormData();
  if (!data.title) { document.getElementById("ef-title").focus(); return; }
  if (warnConflicts(data)) return;
  const id = crypto.randomUUID(), now = new Date().toISOString();
  localEvents.push({
    id, ...data, source: "local",
    organizer_id: ME?.id ?? null, created_by: ME?.id ?? null,
    created_at: now, updated_at: now,
    recurring_event_id: null, original_date: null, is_cancelled: 0,
  });
  closeModal();
  render();
  try {
    await db(
      `INSERT INTO app_calendar__events (id,title,description,location,start_date,start_time,end_date,end_time,all_day,color,organizer_id,attendee_ids,recurrence,source,created_by,created_at,updated_at)
       VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,'local',?,?,?)`,
      [id, data.title, data.description, data.location, data.start_date, data.start_time, data.end_date, data.end_time,
       data.all_day, data.color, ME?.id ?? null, data.attendee_ids, data.recurrence, ME?.id ?? null, now, now]
    );
    // member_id repeats created_by because the hub's roster attribution reads
    // member_id and nothing else: without it the event is attributed to its
    // subject (the event row id), which is not a member row, so a roster peer
    // never sees a steward's calendar event. Contract CI enforces the pairing.
    await publishEvent("calendar.event_created", id, {
      title: data.title,
      start_date: data.start_date,
      all_day: data.all_day === 1,
      created_by: ME?.id ?? "unknown",
      member_id: ME?.id ?? "unknown",
    });
  } catch {
    localEvents = localEvents.filter(e => e.id !== id);
    render();
  }
};

// ─── Edit ─────────────────────────────────────────────────────────────────
async function openEditModal(primaryId, occDate) {
  // A drag writes the same columns this form does. Opening on top of an
  // unsettled drag would let the form's save land first and be silently
  // overwritten by the drag arriving after it. Waiting also means the form
  // opens showing the dragged times rather than the ones it replaced.
  await settlePendingDrag(primaryId);
  const primary = localEvents.find(e => e.id === primaryId);
  if (!primary) return;
  if (primary.recurrence) openScopeModal("edit", primaryId, occDate);
  else openDirectEdit(primary, "all", occDate);
}
function openDirectEdit(ev, scope, occDate) {
  const primary = localEvents.find(e => e.id === (ev._primaryId ?? ev.id)) ?? ev;
  // "This event" on a date that ALREADY has an override opens that override,
  // by looking it up rather than by testing `ev` for one. Every caller reaches
  // here holding the primary — the scope picker re-finds it by id — so a test
  // like `ev.recurring_event_id` can never be true, and the form silently
  // opened on parent-derived values instead. Saving then wrote those over the
  // override, because the save path DOES find the stored row: the member's
  // custom title, time and attendees for that date were replaced by the
  // series' every time they edited the occurrence twice.
  const override = findOverride(primary.id, occDate);
  const editTarget = editTargetFor({ primary, override, scope, occDate });
  openModal(`<div class="modal-header"><h3>Edit Event</h3><button class="btn btn-ghost btn-sm" data-testid="modal-close" onclick="closeModal()">✕</button></div>
    ${buildEventForm(editTarget)}
    <div class="modal-actions">
      <button class="btn btn-ghost" data-testid="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" data-testid="event-edit-submit" onclick="submitEdit('${primary.id}','${scope}','${occDate}','${primary.updated_at ?? ""}','${override?.updated_at ?? ""}')">Save</button>
    </div>`, "event-edit-modal");
}
// Two versions, both read when the form OPENED and neither re-read here.
//
// They are passed separately rather than pre-resolved into "the one to use"
// because the scope is not always known at capture time — the delete picker
// chooses AFTER its versions are taken — so each branch names the row it is
// actually writing: `parentVersion` for a write to the series, and
// `overrideVersion` for a write to this date's exception row.
//
// They are captured at open because that is the moment the form's contents
// became a statement about the data. Re-reading either at submit defeats the
// guard completely: it returns whatever overwrote the row and then passes a
// predicate against it. That is not hypothetical here — `loadLocalEvents()`
// runs after every drag commit, and openEditModal only waits on a drag of its
// OWN primary, so a drag settling on any other event refreshes this array
// underneath an open form.
//
// Empty when the row had no version yet; the guards treat that as "cannot
// claim" rather than as a wildcard.
window.submitEdit = async function(primaryId, scope, occDate, parentVersion, overrideVersion) {
  // openEditModal already waited once, but the form stays open across further
  // interaction. Gating the write itself is what actually holds the invariant:
  // no mutation of an event proceeds while a drag on it is unresolved.
  await settlePendingDrag(primaryId);
  const data = collectFormData();
  if (!data.title) { document.getElementById("ef-title").focus(); return; }
  const now = new Date().toISOString();
  const primary = localEvents.find(e => e.id === primaryId);
  if (!primary) return;
  const seriesIds = new Set([primaryId, ...localEvents.filter(e => e.recurring_event_id === primaryId).map(e => e.id)]);
  if (warnConflicts(data, seriesIds)) return;

  if (scope === "all" || !primary.recurrence) {
    const prevEvents = [...localEvents];
    localEvents = localEvents.map(e => e.id === primaryId ? { ...e, ...data, updated_at: now } : e);
    closeModal();
    render();
    try {
      // Version-guarded for the same reason the standalone drag is, and with
      // the same consequence if it is not: this statement writes whole times
      // and dates, so an unguarded save replays the form's snapshot over
      // anything that moved the row since it opened.
      const stmt = updateEvent({ id: primaryId, version: parentVersion, now,
        set: { title: data.title, description: data.description, location: data.location,
               start_date: data.start_date, start_time: data.start_time,
               end_date: data.end_date, end_time: data.end_time,
               all_day: data.all_day, color: data.color, attendee_ids: data.attendee_ids, recurrence: data.recurrence } });
      const { changed } = await db(stmt.sql, stmt.params);
      if (changed === 0) {
        // Refused, not failed: the row is fine, this form's idea of it is not.
        localEvents = withPendingDrags(prevEvents);
        render();
        showWriteError("This event changed somewhere else while you had it open. Your edit was not saved \u2014 reopen it to see the current version.");
      }
    } catch {
      // Restored THROUGH the pending-drag registry. Before drags existed every
      // mutation went through this modal and could not overlap another, so a
      // wholesale snapshot was a safe undo. A drag on a different event can
      // now land between this snapshot and this failure, and replaying the
      // snapshot raw would wipe that move off the screen while its write had
      // already succeeded.
      localEvents = withPendingDrags(prevEvents);
      render();
    }
    return;
  }

  // Recurrence scopes — pessimistic (multi-step operations). Every branch
  // claims the series at the version this form was built from; see claimSeries.
  let applied = true;
  const btn = modalEl?.querySelector('.modal-actions .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  if (scope === "this") {
    const existing = findOverride(primaryId, occDate);
    const durDays = daysBetween(primary.start_date, primary.end_date);
    const endDate = data.end_date !== occDate ? data.end_date : addDayStr(data.start_date, durDays);
    if (existing) {
      // Claimed against the PARENT as well as itself. Guarding only the
      // override asks "is this row still as I found it", which stays true
      // after someone dissolves or re-splits the series out from under it —
      // and an override whose parent no longer generates that date is drawn
      // nowhere, so the save would report success for an edit no one can see.
      // The series is the thing being contended on, so it is the thing to
      // claim; requireChanges on both makes either one losing roll back both.
      applied = await guardedBatch([
        claimSeries(primary, now, parentVersion),
        updateEvent({ id: existing.id, version: overrideVersion, now,
          set: { title: data.title, description: data.description, location: data.location,
               start_date: data.start_date, start_time: data.start_time,
               end_date: endDate, end_time: data.end_time,
               all_day: data.all_day, color: data.color, attendee_ids: data.attendee_ids } }),
      ]);
    } else {
      const exId = crypto.randomUUID();
      // visibility is carried from the series for the reason the drag paths
      // give: the column defaults to 'everyone' and the row policy reads it,
      // so an override of a non-'everyone' series would publish that date.
      applied = await guardedBatch([
        claimSeries(primary, now, parentVersion),
        insertOverride({ id: exId, primary, occDate, actor: ME?.id ?? null, now,
          values: { ...data, end_date: endDate, organizer_id: ME?.id ?? null } }),
      ]);
    }
  } else if (scope === "following") {
    const rule = JSON.parse(primary.recurrence ?? "{}");
    // end_type as well as end_date, for the reason splitRecurrence gives: the
    // renderer honours end_date, but this form builds its rule from end_type,
    // so a head left saying "never" loses its cap the next time anyone opens
    // and saves it. deleteEvent's split has always set both.
    rule.end_date = addDayStr(occDate, -1); rule.end_type = "date";
    const newId = crypto.randomUUID();
    // requireChanges on the cap, for the reason moveFollowing gives: a batch
    // is atomic against ERRORS, and a cap matching no rows is not an error —
    // so without it the new series is created beside a series that was never
    // capped, and the two generate over the top of each other.
    applied = await guardedBatch([
      updateEvent({ id: primaryId, version: parentVersion, now,
        set: { recurrence: JSON.stringify(rule) } }),
      insertSeries({ id: newId, primary, actor: ME?.id ?? null, now,
        values: { ...data, start_date: occDate, end_date: occDate,
                  organizer_id: ME?.id ?? null, recurrence: data.recurrence } }),
    ]);
  }
  await loadLocalEvents(); closeModal(); render();
  if (!applied) showWriteError("This event could not be saved. It may have been changed or removed — the calendar has been refreshed.");
};

// ─── Delete ───────────────────────────────────────────────────────────────
async function confirmDelete(primaryId, occDate, isRecurring) {
  // Same reason as openEditModal: never race a pending drag on this row.
  await settlePendingDrag(primaryId);
  if (isRecurring) openScopeModal("delete", primaryId, occDate);
  else if (await hubConfirm({ message: "Delete this event?", confirmLabel: "Delete", destructive: true })) {
    // Read after the confirm resolves but before the await in deleteEvent, so
    // it is the version the member was looking at when they said yes.
    const ev = localEvents.find(e => e.id === primaryId);
    deleteEvent(primaryId, occDate, "all", ev?.updated_at ?? "");
  }
}
async function hideEvent(id) {
  const prev = [...syncedEvents];
  syncedEvents = syncedEvents.filter(e => e.id !== id);
  closeModal();
  render();
  try {
    const now = new Date().toISOString();
    await db(`INSERT INTO app_calendar__hidden_synced_events (event_id, hidden_at) VALUES (?,?) ON CONFLICT DO NOTHING`, [id, now]);
  } catch {
    syncedEvents = prev;
    render();
  }
}
async function deleteEvent(primaryId, occDate, scope, parentVersion, overrideVersion) {
  await settlePendingDrag(primaryId);   // same invariant as submitEdit
  const now = new Date().toISOString();
  const primary = localEvents.find(e => e.id === primaryId);
  if (!primary) return;

  if (scope === "all" || !primary.recurrence) {
    const prevEvents = [...localEvents];
    localEvents = localEvents.filter(e => e.id !== primaryId && e.recurring_event_id !== primaryId);
    closeModal();
    render();
    // Two statements, because one `id=? OR recurring_event_id=?` cannot carry
    // a version: the predicate would have to match the primary's `updated_at`
    // against the overrides too, and they keep their own. So the series is
    // deleted under its version and its overrides follow unconditionally.
    //
    // requireChanges is spelled here rather than left to guardedBatch, which
    // flags UPDATEs only — a DELETE is normally allowed to match nothing, and
    // the second statement below relies on that (a series with no overrides is
    // the ordinary case). This one is the exception: no primary matched means
    // the version moved, and the overrides must not be deleted anyway.
    const applied = await guardedBatch([
      { sql: `DELETE FROM app_calendar__events WHERE id=? AND updated_at=?`,
        params: [primaryId, parentVersion], requireChanges: true },
      { sql: `DELETE FROM app_calendar__events WHERE recurring_event_id=?`, params: [primaryId] },
    ]).catch(() => null);
    if (applied === null) {
      localEvents = withPendingDrags(prevEvents);   // same reason as submitEdit
      render();
    } else if (!applied) {
      await loadLocalEvents();
      render();
      showWriteError("This event changed somewhere else while you had it open. It was not deleted \u2014 the calendar has been refreshed.");
    }
    return;
  }

  // Claimed at the version this delete was decided from, like every other
  // recurrence write; see claimSeries.
  let applied = true;
  if (scope === "this") {
    const existing = findOverride(primaryId, occDate);
    if (existing) {
      // Claims the parent too, for the reason submitEdit's matching branch
      // gives: cancelling an override only means anything while the series
      // that generates that date still stands.
      applied = await guardedBatch([
        claimSeries(primary, now, parentVersion),
        updateEvent({ id: existing.id, version: overrideVersion, now,
          set: { is_cancelled: 1 } }),
      ]);
    } else {
      const exId = crypto.randomUUID();
      // A cancellation is still an override row, and it carries the series'
      // title, description and location. `visibility` comes from the series
      // for exactly the reason the other three INSERTs give — the column
      // defaults to 'everyone', so a private series' details would land in a
      // row the whole household can read. Never being RENDERED is not the same
      // as never being readable.
      applied = await guardedBatch([
        claimSeries(primary, now, parentVersion),
        insertOverride({ id: exId, primary, occDate, actor: ME?.id ?? null, now, cancelled: true,
          values: { ...primary, start_date: occDate, end_date: occDate,
                    organizer_id: ME?.id ?? null, attendee_ids: "[]" } }),
      ]);
    }
  } else if (scope === "following") {
    const rule = JSON.parse(primary.recurrence ?? "{}");
    rule.end_date = addDayStr(occDate, -1); rule.end_type = "date";
    applied = await guardedBatch([
      updateEvent({ id: primaryId, version: parentVersion, now,
        set: { recurrence: JSON.stringify(rule) } }),
      { sql: `DELETE FROM app_calendar__events WHERE recurring_event_id=? AND original_date>=?`, params: [primaryId, occDate] },
    ]);
  }
  await loadLocalEvents(); closeModal(); render();
  if (!applied) showWriteError("This event could not be deleted. It may have been changed or removed — the calendar has been refreshed.");
}

// ─── Scope picker ─────────────────────────────────────────────────────────
function openScopeModal(action, primaryId, occDate, dropKey = null) {
  // "move" is a drop that has already happened: the event is on screen at its
  // new time and this picker decides which occurrences keep it. The other two
  // are openers, and their option runs after this modal closes.
  const verb = action === "edit" ? "edit" : action === "delete" ? "delete" : "move";
  const heading = action === "edit" ? "Edit recurring event"
    : action === "delete" ? "Delete recurring event"
    : "Move recurring event";
  // The move branch passes an integer key, never the id: _dropScope owns both
  // closing this modal and suppressing the dismissal cleanup, which a bare
  // closeModal() in the markup would run against a drop that is going ahead.
  // Versions are read HERE, when the picker opens, for the reason submitEdit
  // gives: this modal is user-held, and deleteEvent re-reading `localEvents`
  // after it closes would claim whatever changed underneath it. Captured
  // before a scope is known, so both are passed and each branch names the row
  // it writes.
  const delPrimary = action === "delete" ? localEvents.find(e => e.id === primaryId) : null;
  const delOverride = action === "delete" ? findOverride(primaryId, occDate) : null;
  const pick = (scope) =>
    action === "move"   ? `_dropScope(${dropKey},'${scope}')`
    : action === "edit" ? `closeModal();openDirectEdit_('${primaryId}','${scope}','${occDate}')`
    :                     `closeModal();deleteEvent('${primaryId}','${occDate}','${scope}','${delPrimary?.updated_at ?? ""}','${delOverride?.updated_at ?? ""}')`;
  const scopeOpts = [
    { scope: "this",      icon: "📌", label: "This event",               desc: `Only ${fmtDateShort(occDate)}` },
    { scope: "following", icon: "➡️", label: "This and following events", desc: `From ${fmtDateShort(occDate)} onwards` },
    { scope: "all",       icon: "🔁", label: "All events",               desc: `Every occurrence in the series` },
  ];
  openModal(`
    <div class="modal-header">
      <h3>${heading}</h3>
      <button class="btn btn-ghost btn-sm" data-testid="modal-close" onclick="closeModal()">✕</button>
    </div>
    <p style="font-size:.85rem;color:var(--muted);margin-bottom:14px">Which events do you want to ${verb}?</p>
    ${scopeOpts.map(o => `
      <div class="scope-option" data-testid="scope-option" data-scope="${o.scope}" onclick="${pick(o.scope)}">
        <span class="scope-icon">${o.icon}</span>
        <div><div class="scope-label">${o.label}</div><div class="scope-desc">${o.desc}</div></div>
      </div>`).join("")}
    <div class="modal-actions"><button class="btn btn-ghost" data-testid="modal-cancel" onclick="closeModal()">Cancel</button></div>`, "event-scope-modal");
}
window.openDirectEdit_ = function(primaryId, scope, occDate) {
  const primary = localEvents.find(e => e.id === primaryId);
  if (primary) openDirectEdit(primary, scope, occDate);
};
window.openEditModal   = openEditModal;
window.confirmDelete   = confirmDelete;
window.deleteEvent     = deleteEvent;

// ─── Modal ────────────────────────────────────────────────────────────────
// `testid` names the dialog for the UI-scenario runner (ui-scenarios.json), so a
// scenario can wait on the specific modal it opened rather than any modal.
function openModal(html, testid = "modal") {
  closeModal();
  conflictAck = false;
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal" data-testid="${testid}">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  // Programmatic focus works inside cross-origin iframes (unlike the autofocus
  // attribute, which the browser blocks) because it rides the user's click gesture.
  modalEl.querySelector("[data-autofocus]")?.focus();
}
function closeModal() {
  modalEl?.remove();
  modalEl = null;
  // Cleared BEFORE running, so a cleanup that itself opens a modal (or throws)
  // cannot be run a second time by that modal's own close.
  const cb = onModalClose;
  onModalClose = null;
  cb?.();
}

// ─── Navigation ───────────────────────────────────────────────────────────
function refreshSyncedAndRender() {
  render();
  loadSyncedEvents().then(() => render()).catch(() => {});
}

function prevPeriod() {
  if (viewMode === "month")  pivot.setMonth(pivot.getMonth() - 1);
  else if (viewMode === "week")  pivot.setDate(pivot.getDate() - 7);
  else if (viewMode === "day")   pivot.setDate(pivot.getDate() - 1);
  else pivot.setDate(pivot.getDate() - 30);
  refreshSyncedAndRender();
}
function nextPeriod() {
  if (viewMode === "month")  pivot.setMonth(pivot.getMonth() + 1);
  else if (viewMode === "week")  pivot.setDate(pivot.getDate() + 7);
  else if (viewMode === "day")   pivot.setDate(pivot.getDate() + 1);
  else pivot.setDate(pivot.getDate() + 30);
  refreshSyncedAndRender();
}
function goToday() { pivot = new Date(); refreshSyncedAndRender(); }
function setView(v) { viewMode = v; render(); }

window.prevPeriod      = prevPeriod;
window.nextPeriod      = nextPeriod;
window.goToday         = goToday;
window.setView         = setView;
window.openCreateModal = openCreateModal;
window.openDayPanel    = openDayPanel;
window.showEvent       = showEvent;
window._showEvByKey    = _showEvByKey;
window._hideEvByKey    = _hideEvByKey;
window.closeModal      = closeModal;
window.closePanels     = closePanels;

// ─── Deep link ────────────────────────────────────────────────────────────
function handleDeepLink() {
  const eventId = new URLSearchParams(window.location.search).get("eventId");
  if (!eventId) return;
  const ev = localEvents.find(e => e.id === eventId) ?? syncedEvents.find(e => e.id === eventId);
  if (ev) showEvent(ev.id, ev.start_date, ev._primaryId ?? ev.id, ev._occDate ?? ev.start_date);
}

// ─── Init ─────────────────────────────────────────────────────────────────
(async () => {
  async function fetchMembers() {
    if (!CONTEXT) return;
    try {
      const res = await fetch(`${CONTEXT}?keys=family.members`);
      members = ((await res.json())["family.members"]) ?? [];
    } catch { members = []; }
  }
  // Read-only members (everyone but the steward in a roster) never see the
  // "+ Event" control — writes would be rejected by the hub anyway.
  if (!canWrite) { const b = document.getElementById("new-event-btn"); if (b) b.style.display = "none"; }
  await Promise.all([
    fetchMembers(),
    (async () => { if (DB) { await initDb(); await loadLocalEvents(); } })(),
    loadSyncedEvents(),
  ]);
  render();
  handleDeepLink();
})();
</script>
